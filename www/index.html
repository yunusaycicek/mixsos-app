<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="img/logo-red.png">
<title>Mixsos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütun telefon kabı; masaüstünde ortalanmış 420px "cihaz", telefonda tam ekran. Marka tek tema (açık) — bilinçli seçim. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --red:#C8102E; --red-deep:#B3192B; --red-soft:#FCE9EC;
  --ink:#1C1C1E; --text:#1A1A1A; --muted:#6E6A6B; --line:#EEEAEA;
  --surface:#FFFFFF; --bg:#F7F4F4; --stage:#1B0C0F;
  --ok:#1C8F52; --ok-bg:#E2F5EA; --warn:#B26A00;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--text);font-family:var(--font);margin:0;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.stage{height:100%;display:flex;justify-content:center;align-items:center;padding-block:12px}
#app{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:480px){.stage{padding-block:0}#app{max-height:none;border-radius:0;box-shadow:none}}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding:0 16px}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Butonlar */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:26px;font-weight:600;font-size:15px}
.btn-red{background:var(--red-deep);color:#fff}
.btn-red:active{background:var(--red)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ghost{border:1.5px solid var(--ink);color:var(--ink);background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.powered{text-align:center;font-size:12px;color:var(--text);padding:10px 0 4px}
.powered b{font-weight:800;letter-spacing:-.2px}

/* Splash */
.splash{height:100%;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative}
.logo-img{display:block;width:auto;max-width:70%}
.ob-hero img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ob-final .top img.photo{width:78%;max-width:300px;aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pic{width:100%;height:100%;object-fit:cover;display:block}
.camp-hero{display:block;margin:0 16px 12px;border-radius:16px;overflow:hidden;aspect-ratio:1000/563;width:calc(100% - 32px);max-width:100%;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.poster{flex:none;width:40%;aspect-ratio:3/5;max-width:100%;border-radius:14px;overflow:hidden;scroll-snap-align:start;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.camp-view{position:relative;background:#111;min-height:100%;display:flex;flex-direction:column}
.camp-view img{width:100%;display:block}
.camp-view .cta{position:sticky;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75) 30%);margin-top:auto}
.camp-close{position:absolute;top:12px;left:12px;z-index:3;background:#fff;border-radius:20px;padding:7px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:2px}
.logo{font-weight:800;letter-spacing:1px;color:#fff;display:inline-flex;align-items:flex-end;gap:1px}
.logo .o{display:inline-flex;flex-direction:column;align-items:center}
.logo .o i{display:block;width:.55em;height:.08em;background:#FFC20E;border-radius:2px;margin-top:.04em}
.splash .powered{position:absolute;bottom:28px;left:0;right:0;color:#fff}

/* Onboarding */
.ob{height:100%;display:flex;flex-direction:column;background:var(--surface)}
.ob-hero{position:relative;height:56%;background:radial-gradient(120% 90% at 50% 40%,#E3232F 0%,#B80F1E 70%,#8E0B17 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ob-hero svg.art{width:78%;max-width:300px;height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.skip{position:absolute;top:16px;right:16px;background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.ob-body{flex:1;display:flex;flex-direction:column;padding:18px 16px 12px}
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots span{height:5px;width:6px;border-radius:3px;background:#E3DCDD}
.dots span.on{width:18px;background:var(--red)}
.ob-body h1{font-size:25px;line-height:1.2;font-weight:800;margin-bottom:8px}
.ob-body p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0}
.ob-body .spacer{flex:1}
.ob-final{height:100%;position:relative;background:radial-gradient(110% 70% at 50% 25%,#E3232F,#A80D1B 75%);display:flex;flex-direction:column}
.ob-final .top{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:28px;gap:18px}
.ob-final .card{background:#fff;margin:0 12px 14px;border-radius:24px;padding:22px 16px 10px}
.ob-final h1{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:8px}
.ob-final p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 18px}
.linkbtn{display:block;width:100%;text-align:center;padding:14px 0 4px;font-weight:600;font-size:14px}

/* Login */
.topbar{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;background:var(--surface);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.topbar h2{flex:1;text-align:center;font-size:16px;font-weight:700;margin-right:52px}
.back{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--muted);width:60px}
.form{padding:24px 16px;display:flex;flex-direction:column;gap:14px}
.form h1{font-size:22px;font-weight:800}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.input{height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface);font-size:15px;color:var(--text);width:100%}
.input:focus{border-color:var(--red);outline:none}
.phone{display:flex;gap:8px}
.phone .cc{width:70px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.demo-note{background:#FFF6E0;color:#6A4A00;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.otp{letter-spacing:12px;text-align:center;font-size:22px;font-weight:700}

/* Home */
.home-head{background:var(--red);color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px}
.hello{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hello span{font-weight:600;font-size:14.5px}
.roundbtn{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red);display:inline-flex;align-items:center;justify-content:center}
.wallet{background:var(--surface);color:var(--text);border-radius:16px;padding:14px}
.wallet.dark{background:var(--ink);color:#fff}
.wallet .row{display:flex;justify-content:space-between;align-items:flex-start}
.wallet small{font-size:11.5px;color:var(--muted)}
.wallet.dark small{color:#BDB8B9}
.lvl{font-size:11px;font-weight:600;background:#EFEDED;border-radius:8px;padding:4px 8px;display:inline-flex;gap:4px;align-items:center;color:var(--text)}
.wallet.dark .lvl{background:#3A3A3C;color:#fff}
.bal{font-size:26px;font-weight:800;margin:4px 0 8px}
.bonus{display:flex;align-items:center;gap:6px;font-size:12px}
.bonus b{background:var(--red);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.topup{background:var(--ink);color:#fff;border-radius:18px;padding:9px 16px;font-size:13px;font-weight:600}
.wallet.dark .topup{background:#fff;color:var(--ink);width:100%;margin-top:10px;padding:12px}
.loyal{margin:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.loyal h3{font-size:14.5px;font-weight:700;line-height:1.35}
.loyal .gift{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:10px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sec-title{font-size:16px;font-weight:700;padding:6px 16px 10px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.banner{flex:none;width:78%;height:130px;border-radius:16px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.banner .big{font-size:34px;font-weight:800;line-height:1}
.banner .t{font-size:13px;font-weight:600}
.banner svg{position:absolute;right:-6px;top:6px;width:52%;height:auto}
.tile{flex:none;width:44%;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;scroll-snap-align:start;text-align:left}
.tile .img{height:110px;background:linear-gradient(160deg,#F7C230,#E8A20C);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .img svg{height:84px;width:auto}
.tile div.c{padding:8px 10px 10px;font-size:13px;font-weight:600}
.tile div.c small{display:block;color:var(--muted);font-weight:500;margin-top:2px}

/* Menu */
.search{margin:10px 16px;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:14px;color:var(--text)}
.cats{display:flex;gap:18px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:4}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:10px 0;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;font-weight:500}
.cats button.on{color:var(--text);border-color:var(--red);font-weight:700}
.msec h3{font-size:16px;font-weight:800;padding:16px 16px 4px}
.item{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);width:100%;text-align:left;align-items:center}
.item .txt{flex:1;min-width:0}
.item h4{margin:0 0 4px;font-size:14px;font-weight:700}
.item p{margin:0 0 8px;font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-weight:700;font-size:14px}
.item .ph{width:96px;height:80px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#FBF3F3;overflow:hidden}
.item .ph svg{width:88px;height:auto}
.fab{position:absolute;left:12px;right:12px;bottom:88px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;text-align:left}
.fab .ic{width:38px;height:38px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.fab b{display:block;font-size:14.5px}
.fab small{font-size:11px;color:#C9C4C5}
.fab .amt{margin-left:auto;font-weight:700}

/* Product */
.p-hero{height:230px;background:var(--surface);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.p-hero svg{height:190px;width:auto}
.p-hero img{width:100%;height:100%;object-fit:cover}
.p-hero{overflow:hidden}
.p-head{background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--line)}
.p-head .r{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}
.p-head p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.acc{background:var(--surface);border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;font-size:13.5px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary small{color:var(--muted);font-weight:500;margin-left:4px}
.acc[open] summary svg{transform:rotate(180deg)}
.acc .in{padding:0 16px 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.nut{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.grp{background:var(--surface);margin-top:8px}
.grp .gh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.grp .gh b{font-size:14px}
.grp .gh small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 7px;background:var(--ink);color:#fff}
.tag.opt{background:#EFEDED;color:var(--muted)}
.tag.err{background:var(--red)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);width:100%;font-size:13.5px;font-weight:500;text-align:left}
.opt .x{color:var(--muted);font-size:12.5px;margin-right:10px}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #CFC9CA;flex:none;display:inline-flex;align-items:center;justify-content:center}
.radio.sq{border-radius:6px}
.on .radio{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 4px #fff}
.on .radio.sq{box-shadow:none}
.on .radio.sq::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.bottombar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:6}
.stepper{display:flex;align-items:center;gap:12px;font-weight:700}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.stepper button.lite{background:transparent;color:var(--ink)}
.bottombar .btn{flex:1}

/* Cart */
.card{background:var(--surface);border-radius:16px;margin:12px 16px;padding:14px;border:1px solid var(--line)}
.cline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0;padding-bottom:0}
.cline:first-child{padding-top:0}
.cline .ph{width:56px;height:56px;border-radius:10px;background:#FBF3F3;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.cline .ph svg{width:52px;height:auto}
.cline .t{flex:1;min-width:0}
.cline h4{margin:0;font-size:13.5px}
.cline p{margin:3px 0 8px;font-size:11.5px;color:var(--muted);line-height:1.4}
.cline .r{display:flex;justify-content:space-between;align-items:center}
.cline .stepper{gap:10px}
.cline .stepper button{width:26px;height:26px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#F0ECEC;border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.kv.total{font-weight:800;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.coupon{display:flex;gap:8px}
.coupon .input{height:44px}
.coupon button{flex:none;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:13px}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}

/* Checkout */
.paywith{display:flex;flex-direction:column;gap:8px}
.paywith .opt{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.paywith .opt.on{border-color:var(--ink)}
.cardviz{height:150px;border-radius:18px;background:linear-gradient(135deg,#2B2B2E,#111);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums}
.cardviz .no{font-size:18px;letter-spacing:2px;font-weight:600}
.cardviz .bt{display:flex;justify-content:space-between;font-size:12px;color:#CFCACB}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secure{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-content:center}

/* Tracking */
.track{display:flex;flex-direction:column;gap:0}
.tstep{display:flex;gap:12px;position:relative;padding-bottom:20px}
.tstep:last-child{padding-bottom:0}
.tstep .dot{width:28px;height:28px;border-radius:50%;background:#EFEDED;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
.tstep.done .dot{background:var(--ok)}
.tstep.cur .dot{background:var(--red);animation:pulse 1.4s infinite}
.tstep::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#EFEDED}
.tstep.done::before{background:var(--ok)}
.tstep:last-child::before{display:none}
.tstep b{display:block;font-size:14px}
.tstep small{color:var(--muted);font-size:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}70%{box-shadow:0 0 0 10px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.okhead{text-align:center;padding:24px 16px 8px}
.okhead .big{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.okhead h1{font-size:20px;font-weight:800}

/* QR */
.qrbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin:14px 16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qrbox canvas{width:180px;height:180px;image-rendering:pixelated}
.timer{display:flex;align-items:center;gap:6px;background:#F3F0F0;border-radius:14px;padding:5px 12px;font-size:12.5px;font-weight:600}
.codebox{width:100%;background:#F6F3F3;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.codebox span.m{font-weight:800;letter-spacing:3px}

/* Branches */
.br{display:flex;gap:12px;align-items:center;background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.br .thumb{width:62px;height:62px;border-radius:12px;flex:none;background:linear-gradient(160deg,#3A1418,#7A1420);display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:9px;font-weight:800;padding-bottom:8px}
.br h4{margin:0 0 3px;font-size:14px}
.br p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.open{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:3px 8px;border-radius:8px}
.closed{font-size:11px;font-weight:700;color:var(--muted);background:#EFEDED;padding:3px 8px;border-radius:8px}
.bd-img{height:150px;margin:12px 16px 0;border-radius:16px;background:linear-gradient(170deg,#2B0E12,#8E1220 70%,#C8102E);display:flex;align-items:center;justify-content:center}
.facts{display:flex;flex-direction:column;gap:10px;font-size:13px}
.facts div{display:flex;gap:10px;align-items:center}
.hours .kv{font-size:13px}

/* Profile */
.prof{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.menu-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;font-size:14px;font-weight:500;text-align:left}
.menu-row:last-child{border-bottom:0}

/* Tabbar */
#tabbar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:24px;box-shadow:0 8px 28px rgba(60,10,15,.16);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9B9596;font-weight:600}
#tabbar button.on{color:var(--ink)}
#tabbar .qr{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;justify-content:center;margin:0 auto;box-shadow:0 6px 16px rgba(200,16,46,.4)}
.withnav{padding-bottom:96px}

/* Sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(20,8,10,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:17px;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips button{height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.chips button.on{border-color:var(--ink);background:var(--ink);color:#fff}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.badge{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-size:9.5px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.relative{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function logo(size){return `<img class="logo-img" src="img/logo-white.png" alt="Mixsos" style="height:${size*1.6}px">`}
function powered(){return `<div class="powered">Powered by <b>Lokus Studio</b></div>`}

// ---------- Fiyat ----------
function unitPrice(p,sel){let t=p.price;p.groups.forEach(g=>(sel[g.id]||[]).forEach(i=>t+=g.opts[i][1]));return t}
function cartTotals(){
  const sub=S.cart.reduce((a,l)=>a+l.unit*l.qty,0);
  let disc=0;if(S.coupon){const c=COUPONS[S.coupon];disc=c.type==='pct'?Math.round(sub*c.v)/100:Math.min(c.v,sub)}
  const total=Math.max(0,sub-disc);const kdv=Math.round(total/1.10*0.10*100)/100;
  return {sub,disc,total,kdv,count:S.cart.reduce((a,l)=>a+l.qty,0)};
}

 <p class="hint pad" style="margin-top:12px">Kasada bu kodu okut; tutar bakiyenden düşülür. Kod 5 dakikada bir yenilenir.</p></div>`;

V.branches=()=>`<div class="withnav"><div class="topbar" style="position:static"><h2 style="margin:0">Şubeler</h2></div>
 ${BR.map(b=>`<button class="br" data-a="openb" data-v="${b.id}"><div class="thumb">MIXSOS</div><div style="flex:1;min-width:0"><h4>${esc(b.name)} <small class="muted" style="font-weight:500">${b.km}</small></h4><p>${esc(b.addr)}</p></div><span class="${b.open?'open':'closed'}">${b.open?'Açık':'Kapalı'}</span></button>`).join('')}</div>`;

V.branch=()=>{const b=BR.find(x=>x.id===S.bid);const days=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
 return `<div class="withnav"><div class="topbar"><button class="back" data-tab="branches">${I.back}Geri</button><h2>${esc(b.name)}</h2></div>
 <div class="bd-img">${logo(30)}</div>
 <div class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(b.name)} <small class="muted" style="font-weight:500">${b.km}</small></b><span class="${b.open?'open':'closed'}">${b.open?'Açık':'Kapalı'}</span></div>
 <p class="hint" style="margin:0">${esc(b.addr)}<br><span class="num">${esc(b.tel)}</span></p>
 <div class="two"><a class="btn btn-ink" style="height:42px;text-decoration:none;font-size:13.5px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.addr)}" target="_blank" rel="noopener">Yol Tarifi Al</a><button class="btn btn-ghost" style="height:42px;font-size:13.5px" data-a="contact">İletişime Geç</button></div>
 <button class="btn btn-red" style="height:44px" data-a="orderhere" data-v="${b.id}">Sipariş Ver</button></div>
 <div class="card"><b style="font-size:14px">Erişilebilirlik</b><div class="facts" style="margin-top:12px"><div>${I.wifi}Wi-Fi</div><div>${I.park}Otopark</div><div>${I.smoke}Sigara İçilebilir Alan</div><div>${I.plug}Priz</div></div></div>
 <div class="card hours num"><b style="font-size:14px">Çalışma saatleri</b><div style="margin-top:8px">${days.map(d=>`<div class="kv"><span>${d}</span><span>10:30 - 02:00</span></div>`).join('')}</div></div></div>`};

V.profile=()=>{const u=S.user;
 return `<div class="withnav"><div class="topbar" style="position:static"><h2 style="margin:0">Profil</h2></div>
 <div class="card">${u?`<div class="prof"><div class="avatar">${esc(u.name[0]||'M').toLocaleUpperCase('tr')}</div><div><b>${esc(u.name)}</b><div class="muted num" style="font-size:13px">+90 ${esc(u.phone)}</div></div></div>`
 :`<b>Misafir olarak geziyorsun</b><p class="hint">Sipariş geçmişi, bakiye ve damga kartı için giriş yap.</p><button class="btn btn-red" data-a="tologin">Giriş yap ya da kayıt ol</button>`}</div>
 <div class="card"><b style="font-size:14px">Siparişlerim</b>${S.orders.length?S.orders.map(o=>`<div class="menu-row num"><span>#${o.no} · ${o.lines.reduce((a,l)=>a+l.qty,0)} ürün</span><span>${fmt(o.total)}</span></div>`).join(''):'<p class="hint">Henüz siparişin yok.</p>'}</div>
 ${u?`<div class="card"><button class="menu-row" data-a="logout" style="color:var(--red)">Çıkış yap</button></div>`:''}
 <div class="pad">${powered()}</div></div>`};

// ---------- Render ----------
function tabbar(){const tabs=[['home','Anasayfa',I.home],['menu','Menü',I.book],['qr','',I.qr],['branches','Şubeler',I.pin],['profile','Profil',I.user]];
 const active=S.screen==='branch'?'branches':S.screen;const n=cartTotals().count;
 return tabs.map(([k,l,ic])=>k==='qr'?`<button class="qr" data-tab="qr" aria-label="QR ile öde">${ic}</button>`:`<button class="${active===k?'on':''}" data-tab="${k}"><span class="relative">${ic}${k==='menu'&&n?`<span class="badge num">${n}</span>`:''}</span>${l}</button>`).join('')}
function render(){clearTimers();
 $('#screen').innerHTML=V[S.screen]()+(S.sheet?sheet():'');
 const withNav=['home','menu','qr','branches','branch','profile','track'].includes(S.screen);
 const tb=$('#tabbar');tb.hidden=!withNav;if(withNav)tb.innerHTML=tabbar();
 after();}
function sheet(){if(S.sheet==='topup')return `<div class="scrim" data-a="closesheet"><div class="sheet" data-stop="1"><h3>Bakiye yükle</h3><div class="chips">${[100,250,500,750,1000,2000].map(v=>`<button class="num ${S.topup===v?'on':''}" data-a="tv" data-v="${v}">₺${v}</button>`).join('')}</div><p class="hint" style="margin:0">₺500 ve üzeri yüklemelerde %5 bonus.</p><button class="btn btn-red" data-a="dotopup">Devam · <span class="num">${fmt(S.topup)}</span></button></div></div>`;
 if(S.sheet==='contact'){const b=BR.find(x=>x.id===S.bid);return `<div class="scrim" data-a="closesheet"><div class="sheet" data-stop="1"><h3>${esc(b.name)}</h3><p class="hint" style="margin:0">Telefon</p><div class="input num" style="display:flex;align-items:center;user-select:all">${esc(b.tel)}</div><button class="btn btn-ink" data-a="copytel">Numarayı kopyala</button></div></div>`}return ''}
function after(){
 if(S.screen==='splash')timers.push(setTimeout(()=>go('onboarding'),1400));
 if(S.screen==='qr'){drawQR();let left=299;const el=$('#qrt');timers.push(setInterval(()=>{left--;if(left<0){left=299;S.qrCode=rndCode();drawQR()}el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000))}
 if(S.screen==='track'){const o=S.orders[0];if(o.status<2)timers.push(setInterval(()=>{o.status++;render()},4000))}
 if(S.screen==='menu'){const q=$('#q');q.addEventListener('input',e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)})}
 if(S.screen==='checkout')bindCard();
 if(S.screen==='login'){$('#loginForm').addEventListener('submit',loginSubmit);const f=$('#phone')||$('#otp');f&&f.focus()}
 if(S.screen==='threeds')$('#tdsForm').addEventListener('submit',tdsSubmit);
}
const rndCode=()=>String(Math.floor(1000+Math.random()*9000));
function drawQR(){const c=$('#qrc');if(!c)return;const x=c.getContext('2d');const N=29;x.fillStyle='#fff';x.fillRect(0,0,N,N);x.fillStyle='#111';
 let seed=+S.qrCode*7919;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(r()>.52)x.fillRect(i,j,1,1);
 [[0,0],[N-7,0],[0,N-7]].forEach(([a,b])=>{x.fillStyle='#fff';x.fillRect(a-1<0?0:a-1,b-1<0?0:b-1,8,8);x.fillStyle='#111';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#111';x.fillRect(a+2,b+2,3,3)})}

// ---------- Formlar ----------
function loginSubmit(e){e.preventDefault();
 if(!S.otpSent){const v=$('#phone').value.replace(/\D/g,'');if(!/^5\d{9}$/.test(v)){toast('Numarayı 5 ile başlayan 10 hane olarak gir.');return}S.phone=v;S.otpSent=true;render();toast('Doğrulama kodu gönderildi (demo).');return}
 if($('#otp').value!=='123456'){toast('Kod hatalı. Demo kodu: 123456');return}
 const name=($('#uname').value||'').trim()||'Mixsos Üyesi';S.user={name,phone:S.phone};S.otpSent=false;
 if(S.afterLogin){const a=S.afterLogin;S.afterLogin=null;go(a)}else go('home');toast('Hoş geldin, '+name+'!')}
function bindCard(){const m={cname:'name',cno:'no',cexp:'exp',ccvc:'cvc'};Object.keys(m).forEach(id=>{const el=$('#'+id);if(!el)return;el.addEventListener('input',e=>{let v=e.target.value;
  if(id==='cno'){v=v.replace(/\D/g,'').slice(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim()}
  if(id==='cexp'){v=v.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}
  if(id==='ccvc'){v=v.replace(/\D/g,'').slice(0,4);e.target.value=v}
  S.card[m[id]]=v;const cv=$('.cardviz');if(cv){cv.querySelector('.no').textContent=(S.card.no||'').padEnd(16,'•').replace(/(.{4})/g,'$1 ').trim();cv.querySelectorAll('.bt span')[0].textContent=(S.card.name||'AD SOYAD').toLocaleUpperCase('tr');cv.querySelectorAll('.bt span')[1].textContent=S.card.exp||'AA/YY'}})})}
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function tdsSubmit(e){e.preventDefault();if($('#tds').value!=='283126'){toast('Kod hatalı. Demo kodu: 283126');return}finishPayment()}
function finishPayment(){
 if(S.pay.kind==='topup'){const a=S.pay.amount;S.balance+=a;if(a>=500)S.bonus+=Math.round(a*0.05);S.pay=null;go('home');toast(fmt(a)+' bakiye yüklendi.');return}
 const t=cartTotals();const o={no:String(Math.floor(100000+Math.random()*900000)),lines:S.cart.slice(),total:t.total,branch:S.branch.name,status:0};
 S.orders.unshift(o);S.stamps=Math.min(10,S.stamps+S.cart.filter(l=>DONER_IDS.includes(l.pid)).reduce((a,l)=>a+l.qty,0));
 S.cart=[];S.coupon=null;S.pay=null;go('track')}

// ---------- Olaylar ----------
document.addEventListener('click',e=>{
 const st=e.target.closest('[data-stop]');const el=e.target.closest('[data-a],[data-tab]');if(!el)return;
 if(st&&el.dataset.a==='closesheet'&&!e.target.closest('[data-a]:not(.scrim)'))return;
 if(el.dataset.tab){go(el.dataset.tab,el.dataset.tab==='qr'&&!S.qrCode?{qrCode:rndCode()}:{});return}
 const a=el.dataset.a,v=el.dataset.v;
 switch(a){
  case 'obnext':S.ob++;render();break;
  case 'obskip':S.ob=3;render();break;
  case 'tologin':go('login',{otpSent:false});break;
  case 'loginback':S.user?go('profile'):go('onboarding',{ob:3});break;
  case 'changephone':S.otpSent=false;render();break;
  case 'guest':go('home');break;
  case 'notif':toast('Bildirimler FCM bağlanınca burada görünecek.');break;
  case 'topup':S.sheet='topup';render();break;
  case 'tv':S.topup=+v;render();break;
  case 'closesheet':if(e.target===el){S.sheet=null;render()}break;
  case 'dotopup':if(!S.user){S.afterLogin='home';toast('Bakiye yüklemek için giriş yap.');go('login',{otpSent:false});break}S.pay={kind:'topup',amount:S.topup};go('checkout');break;
  case 'opencat':go('menu',{cat:v});setTimeout(()=>{const s=$('#sec-'+v);s&&s.scrollIntoView({block:'start'})},30);break;
  case 'cat':S.cat=v;render();{const s=$('#sec-'+v);s&&s.scrollIntoView({behavior:'smooth',block:'start'})}break;
  case 'opencamp':S._from=S.screen;go('camp',{cid:v});break;
  case 'openp':S._from=S.screen==='camp'?'home':S.screen;go('product',{pid:v,sel:{},qty:1,_tried:false});break;
  case 'back':go(S._from||'menu');break;
  case 'pick':{const p=prod(S.pid);const g=p.groups.find(x=>x.id===el.dataset.g);const i=+el.dataset.i;let s=S.sel[g.id]||[];
    if(g.max===1)s=[i];else if(s.includes(i))s=s.filter(x=>x!==i);else if(s.length<g.max)s=[...s,i];else{toast('En fazla '+g.max+' seçim yapabilirsin.');break}
    S.sel[g.id]=s;const top=$('#screen').scrollTop;render();$('#screen').scrollTop=top;break}
  case 'qty':{const n=S.qty+(+v);if(n<1){go(S._from||'menu');break}S.qty=n;const top=$('#screen').scrollTop;render();$('#screen').scrollTop=top;break}
  case 'addcart':{const p=prod(S.pid);const miss=p.groups.find(g=>g.req&&!(S.sel[g.id]||[]).length);
    if(miss){S._tried=true;render();const g=$('#g-'+miss.id);g&&g.scrollIntoView({behavior:'smooth',block:'center'});toast(miss.name+' zorunlu.');break}
    const opts=[];p.groups.forEach(g=>(S.sel[g.id]||[]).forEach(i=>opts.push(g.opts[i][0])));
    const key=p.id+'|'+opts.join('|');const ex=S.cart.find(l=>l.key===key);const unit=unitPrice(p,S.sel);
    if(ex)ex.qty+=S.qty;else S.cart.push({key,pid:p.id,opts,unit,qty:S.qty});
    go('menu');toast(p.name+' sepete eklendi.');break}
  case 'tocart':case 'tomenu':go(a==='tocart'?(cartTotals().count?'cart':'menu'):'menu');if(a==='tocart'&&!cartTotals().count)toast('Önce menüden bir ürün seç.');break;
  case 'cq':{const l=S.cart[+el.dataset.i];l.qty+=+v;if(l.qty<1)S.cart.splice(+el.dataset.i,1);render();break}
  case 'mode':S.mode=v;render();break;
  case 'coupon':{const c=($('#cpn').value||'').trim().toLocaleUpperCase('tr');if(COUPONS[c]){S.coupon=c;render();toast(COUPONS[c].label+' uygulandı.')}else toast('Bu kod geçerli değil. Demo: MIXSOS10');break}
  case 'rmcoupon':S.coupon=null;render();break;
  case 'tocheckout':if(!S.user){S.afterLogin='checkout';toast('Siparişi tamamlamak için giriş yap.');go('login',{otpSent:false,pay:{kind:'order'}});break}go('checkout',{pay:{kind:'order'},payMethod:'card'});break;
  case 'tocheckout2':break;
  case 'tohome':go('home',{pay:null});break;
  case 'pm':S.payMethod=v;render();break;
  case 'testcard':S.card={name:'Test Kullanıcı',no:'5528790000000008',exp:'12/30',cvc:'123'};render();break;
  case 'pay':{const isTop=S.pay.kind==='topup';
    if(!isTop&&S.payMethod==='wallet'){const t=cartTotals().total;if(S.balance+S.bonus<t){toast('Bakiye yetersiz. Önce bakiye yükle.');break}let r=t;const fromB=Math.min(S.bonus,r);S.bonus-=fromB;r-=fromB;S.balance-=r;finishPayment();break}
    const c=S.card;if(c.name.trim().length<3){toast('Kart üzerindeki ismi gir.');break}if(c.no.length<15||!luhn(c.no)){toast('Kart numarası geçersiz.');break}
    if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(c.exp)){toast('Son kullanma tarihini AA/YY olarak gir.');break}if(c.cvc.length<3){toast('CVC 3 haneli olmalı.');break}
    go('threeds');break}
  case 'eye':S.showCode=!S.showCode;render();break;
  case 'openb':go('branch',{bid:v});break;
  case 'orderhere':{const b=BR.find(x=>x.id===v);if(!b.open){toast('Şube şu an kapalı.');break}S.branch=b;go('menu');toast(b.name+' seçildi.');break}
  case 'contact':S.sheet='contact';render();break;
  case 'copytel':{const b=BR.find(x=>x.id===S.bid);(navigator.clipboard?navigator.clipboard.writeText(b.tel):Promise.reject()).then(()=>toast('Numara kopyalandı.')).catch(()=>toast('Numarayı seçip kopyala.'));break}
  case 'logout':S.user=null;go('home');toast('Çıkış yapıldı.');break;
 }
});
render();
</script>
</body>
</html>
