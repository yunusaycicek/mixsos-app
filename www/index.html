<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/logo-red.png">
<title>Mixsos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Coffy akışı + Mixsos kimliği: siyah üst bar, kırmızı vurgu, beyaz kartlar, sabit alt menü. Tek (açık) tema, bilinçli. */
:root{
  --red:#C8102E; --red-d:#A50D25; --red-t:#FCEBEE;
  --ink:#111111; --text:#1B1B1B; --muted:#7A7576; --line:#ECE8E8;
  --card:#FFFFFF; --bg:#F3F1F1; --head:#000000; --ok:#1E9E5A; --ok-t:#E3F5EB; --warn:#FFF4DA;
  --f:"Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#1a0a0d;color:var(--text);font-family:var(--f);font-size:14px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img{max-width:100%;display:block}
#app{position:relative;margin:0 auto;width:100%;max-width:440px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){body{display:flex;align-items:center;justify-content:center;padding:16px}#app{height:min(100%,900px);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3,h4,p{margin:0}

/* Üst bar */
.hdr{background:var(--head);color:#fff;padding:calc(var(--top) + 10px) 16px 12px;display:flex;align-items:center;gap:10px;min-height:56px;position:sticky;top:0;z-index:20}
.hdr h2{flex:1;text-align:center;font-size:16px;font-weight:500}
.hdr .side{width:40px;display:flex;align-items:center}
.hdr .side.r{justify-content:flex-end}
.hdr.home{padding-right:0}
.hdr.home .logo{flex:1;display:flex;justify-content:center}
.hdr.home .logo img{height:34px;width:auto}
.qrbtn{background:#fff;color:var(--ink);border-radius:12px 0 0 12px;padding:7px 10px 7px 10px;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;line-height:1.1;text-align:left}
.ico{display:inline-flex;align-items:center;justify-content:center}
.branchbar{background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:11px 16px;width:100%;font-weight:600;font-size:14px;text-align:left}
.branchbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Carousel */
.carousel{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;aspect-ratio:16/9;scroll-snap-align:start;max-width:100%}
.slide img{width:100%;height:100%;object-fit:cover}
.counter{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px}

/* Damga kartı */
.loyal{margin:12px 16px 4px;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.loyal .t{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;font-weight:500;width:100%;text-align:left}
.loyal .t b{font-weight:500;display:flex;gap:6px;align-items:center;font-size:12px}
.loyal .b{display:flex;align-items:center;gap:12px;padding:12px}
.loyal .cnt{font-size:20px;font-weight:600;color:var(--text)}
.loyal .cnt small{color:var(--red);font-size:14px}
.bar{flex:1;height:10px;background:#EEE9E9;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px}
.free{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.2}
.free .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

/* Kategori çipleri */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);position:sticky;top:calc(var(--top) + 56px);z-index:15;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chip.on{background:var(--red);color:#fff}
.sec{padding:4px 16px 8px;scroll-margin-top:calc(var(--top) + 110px)}
.sec h3{font-size:15px;font-weight:600;margin:10px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Ürün kartı */
.pc{background:var(--card);border-radius:12px;overflow:hidden;position:relative;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.05);width:100%}
.pc .im{position:relative;aspect-ratio:1/1;background:#fff;max-width:100%}
.pc .imb{display:block;width:100%;height:100%}
.pc .im img{width:100%;height:100%;object-fit:contain;padding:8px}
.pc .im img.cover{object-fit:cover;padding:0}
.pc .tx{padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc .nm{font-size:13.5px;font-weight:600;line-height:1.3;min-height:2.6em}
.pc .pr{font-size:14px;font-weight:700}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;z-index:2}
.add{position:absolute;right:8px;bottom:8px;z-index:2}
.plus{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.mini{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:2px 2px 2px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:600}
.badge-new{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;transform:rotate(-6deg);z-index:2}

/* Döner Box animasyonu: malzemeler kutunun arkasındaki tuvale düşer, kutunun dolu üst kısmının arkasında kaybolur */
.dbx{display:block;position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(70% 60% at 50% 70%,#FFF3F0,#fff 70%)}
.dbx canvas{position:absolute;inset:0;width:100%;height:100%}
.dbx img{position:absolute;left:50%;bottom:5%;height:68%!important;width:auto!important;max-width:none;transform:translateX(-50%);transform-origin:50% 100%;padding:0!important;object-fit:contain}
.dbx img.bump{animation:bump .28s ease-out}
@keyframes bump{40%{transform:translateX(-50%) scale(1.035,.975)}}
.pd-hero .dbx img{height:76%!important}
/* Yasal sayfalar ve güven bandı */
.doc{background:#fff;margin:10px 16px;border-radius:12px;padding:18px 16px 20px;line-height:1.65;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.doc h2{font-size:18px;font-weight:600;line-height:1.3;margin-bottom:4px}
.doc h3{font-size:14.5px;font-weight:600;margin:18px 0 6px}
.doc p,.doc li{color:#333}
.doc p+p{margin-top:8px}
.doc ul{margin:6px 0;padding-left:20px}
.doc .meta{font-size:12px;color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.doc td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.doc td:first-child{color:var(--muted);width:42%}
.ph{background:#FFF1C2;color:#7A5300;border-radius:4px;padding:0 4px;font-weight:500}
.trust{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 8px}
.trust img{height:24px;width:auto;max-width:100%}
.ssl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:600}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;padding:4px 16px;font-size:11.5px}
.legal-links button{color:var(--muted);text-decoration:underline}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;text-align:left;width:100%}
.consent .radio{margin-top:1px}
.consent u{color:var(--red);text-decoration:underline;font-weight:500}
.iyz{display:flex;justify-content:center;padding:4px 0 2px}
.iyz img{height:26px;width:auto}
.vbx{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 70%;background:#C9862E}
.pd-hero .vbx{object-position:50% 60%}
@media (prefers-reduced-motion:reduce){.vbx{animation:none}}
/* Alt menü */
#nav{background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(6px + var(--bot));flex:none}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#9A9495;position:relative}
#nav button.on{color:var(--red);font-weight:600}
.nb{position:absolute;top:-4px;left:calc(50% + 4px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}

/* Genel kart ve satırlar */
.card{background:var(--card);border-radius:12px;margin:10px 16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;margin:8px 16px;padding:14px;width:calc(100% - 32px);text-align:left;font-size:13.5px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row .l{flex:1}
.pad{padding:0 16px}
.label{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:26px;font-weight:500;font-size:15px;width:100%}
.btn-red{background:var(--red);color:#fff}
.btn-red[disabled]{opacity:.45}
.btn-out{border:1.5px solid #D9D4D4;background:#fff;color:var(--text)}
.btn-ink{background:var(--ink);color:#fff}
.sm{height:36px;font-size:12.5px;border-radius:18px;padding:0 16px;width:auto}
.bottom{position:sticky;bottom:0;z-index:12;background:var(--bg);padding:10px 16px calc(12px)}
.paybar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:30px;padding:6px 6px 6px 20px;box-shadow:0 -2px 18px rgba(0,0,0,.08)}
.paybar .t{font-size:20px;font-weight:600;flex:none}
.paybar .btn{flex:1}
.input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:15px}
.input:focus{outline:none;border-color:var(--red)}
textarea.input{height:84px;padding:12px 14px;resize:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.note{background:var(--warn);color:#6A4A00;font-size:12px;line-height:1.5;border-radius:10px;padding:10px 12px}
.pill{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
.pill.req{background:var(--ok);color:#fff}
.pill.req.err{background:var(--red)}
.pill.soft{background:#EEE;color:var(--muted)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C9C3C4;flex:none;display:inline-flex;align-items:center;justify-content:center}
.on>.radio,.on .radio{border:2px solid var(--ink)}
.on>.radio::after,.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink)}
.radio.sq{border-radius:6px}
.on .radio.sq{background:var(--ink)}
.on .radio.sq::after{width:9px;height:5px;border-radius:0;background:none;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.toggle{width:44px;height:26px;border-radius:13px;background:#D6D1D2;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--red)}
.toggle.on::after{left:21px}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0}
.kv.tot{font-weight:600;font-size:15px;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.stepper{display:flex;align-items:center;gap:12px;font-weight:600}
.stepper .s{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.stepper .s.b{background:var(--ink);color:#fff}
.stepper .s.l{color:#9A9495}

/* Ürün detayı */
.pd-hero{position:relative;background:#fff;aspect-ratio:1/0.82;max-width:100%}
.pd-hero img{width:100%;height:100%;object-fit:contain;padding:18px}
.pd-hero img.cover{object-fit:cover;padding:0}
.fab{position:absolute;top:calc(var(--top) + 12px);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;z-index:3}
.fab.l{left:16px;background:var(--red);color:#fff}
.fab.r{right:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pd-info{background:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pd-info h1{font-size:20px;font-weight:600}
.pd-info p{font-size:12.5px;color:var(--muted);line-height:1.55}
.stamp{display:flex;align-items:center;gap:8px;background:var(--red-t);color:var(--red-d);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:500}
.grp{background:#fff;margin-top:8px}
.grp .gh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px}
.grp .gh b{font-size:15px;font-weight:600}
.grp .gh .pill{flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;font-size:13.5px;font-weight:500}
.opt .l{flex:1}
.opt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}

/* Sepet */
.ci{background:#fff;border-radius:12px;margin:10px 16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ci h4{font-size:15px;font-weight:600;margin-bottom:6px}
.ci .o{font-size:12px;color:var(--muted);line-height:1.6}
.ci .o b{color:var(--text);font-weight:500}
.ci .r{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ci .p{color:var(--red);font-weight:600;font-size:15px}
.up{flex:none;width:44%;max-width:180px;background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:left}
.up img{aspect-ratio:1.3/1;object-fit:contain;width:100%}
.up .n{font-size:12px;font-weight:600;line-height:1.3;min-height:2.6em}
.up .bt{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.sqplus{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.camp{flex:none;width:72%;max-width:260px;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;background:#fff}
.camp .t{flex:1;font-size:12.5px;font-weight:500;line-height:1.35}
.camp.on{border-color:var(--red);background:var(--red-t)}

/* Kampanyalar */
.ccard{display:block;width:calc(100% - 32px);margin:10px 16px;background:#fff;border-radius:12px;overflow:hidden;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ccard .im{aspect-ratio:16/7;max-width:100%;overflow:hidden}
.ccard .im img{width:100%;height:100%;object-fit:cover}
.ccard .tt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font-size:14px;font-weight:500}
.cssban{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 22px;color:#fff;gap:4px}
.cssban b{font-size:30px;font-weight:700;line-height:1}
.cssban span{font-size:13px;font-weight:500;opacity:.9}
.promo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;margin:12px 16px;padding:8px 8px 8px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.promo input{flex:1;border:0;border-bottom:1px solid var(--line);height:36px;outline:none;font-size:13px;min-width:0}

/* Hesabım */
.info{background:#fff;border-radius:12px;margin:10px 16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.info .l{flex:1}
.info .l small{display:block;font-size:12px;color:var(--muted)}
.info .l b{font-size:16px;font-weight:600}
.edit{width:34px;height:34px;border-radius:50%;border:1.5px solid #D9D4D4;display:flex;align-items:center;justify-content:center}
.hero-r{background:var(--red);color:#fff;border-radius:12px;margin:10px 16px;padding:14px;display:flex;align-items:center;gap:12px;width:calc(100% - 32px);text-align:left}
.hero-r .ic{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.hero-r b{display:block;font-weight:600}
.hero-r small{font-size:11.5px;opacity:.9}
.ver{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:8px 16px 24px}

/* QR */
.qrwrap{background:#fff;flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
.qrwrap p{text-align:center;font-size:14px;font-weight:500;max-width:28ch;line-height:1.45}
.qrwrap canvas{width:200px;height:200px;image-rendering:pixelated}
.qcode{font-size:22px;font-weight:600;letter-spacing:8px}
.dots{display:flex;align-items:center;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--red)}
.dots i.off{background:#DDD}
.wal{background:#fff;margin-top:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.wal .r{display:flex;align-items:center}
.wal .r>div{flex:1}
.wal .r>div+div{border-left:1px solid var(--line);padding-left:16px;display:flex;align-items:center;gap:8px;font-size:13px}
.wal b{font-size:24px;font-weight:600}

/* Şube seç */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:26px;padding:4px;margin:0 16px 14px}
.seg button{height:42px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 4px;background:#fff}
.selects select{height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-weight:500}
.bc{display:block;width:calc(100% - 32px);margin:10px 16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.bc.on{border-color:var(--ink)}
.bc .h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.bc .h .nm{flex:1}
.bc .mi{width:22px;height:22px;border-radius:50%;background:var(--red-t);color:var(--red);display:flex;align-items:center;justify-content:center}
.bc p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.bc .hrs{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:10px}
.openp{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-t);padding:3px 8px;border-radius:8px}
.closedp{font-size:11px;font-weight:600;color:var(--muted);background:#EEE;padding:3px 8px;border-radius:8px}
.map{position:relative;height:300px;background:#E9EEE6;overflow:hidden}
.map>svg{width:100%;height:100%}
.msearch{position:absolute;left:16px;right:16px;top:12px;background:#fff;border-radius:24px;height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mpill{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;border-radius:20px;padding:9px 16px}

/* Katmanlar */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;max-height:86%;overflow-y:auto;padding:10px 0 calc(16px + var(--bot))}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:#444;margin:4px auto 12px}
.sheet h3{text-align:center;font-size:20px;font-weight:600;margin-bottom:10px}
.sl{display:flex;align-items:center;gap:12px;background:#fff;margin:8px 16px;border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sl img{width:70px;height:56px;object-fit:contain;flex:none}
.sl .t{flex:1;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.sl .t span{font-weight:500}
.prev{flex:none;width:78%;max-width:280px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prev .d{font-size:13px;font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prev .i{font-size:12.5px;color:var(--muted);min-height:3.2em;line-height:1.5}
#toast{pointer-events:none;position:absolute;left:12px;right:12px;top:calc(var(--top) + 10px);background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s ease}
#toast .ck{width:26px;height:26px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
#toast.err .ck{background:var(--red)}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
#anim{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);pointer-events:none}
#anim .c{width:150px;height:150px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,255,255,.35),0 0 0 16px rgba(200,16,46,.6);animation:pop .75s cubic-bezier(.2,.9,.3,1.2) forwards}
#anim img{width:84px}
@keyframes pop{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.05);opacity:1}80%{transform:scale(1)}100%{transform:scale(.6) translateY(260px);opacity:0}}
.splash{position:absolute;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.splash .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;animation:kb 2.4s ease-out forwards}
.splash .lg{position:relative;width:62%;max-width:260px;animation:fin .8s .2s both}
.splash .pw{position:absolute;bottom:calc(28px + var(--bot));color:#fff;font-size:12px;opacity:.85}
@keyframes kb{from{transform:scale(1.25)}to{transform:scale(1.05)}}
@keyframes fin{from{opacity:0;transform:translateY(12px)}}
.story{position:absolute;inset:0;z-index:95;background:#000;display:flex;flex-direction:column}
.story img{width:100%;height:100%;object-fit:cover}
.story .x{position:absolute;right:14px;top:calc(var(--top) + 22px);width:40px;height:40px;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.story .pb{position:absolute;left:12px;right:12px;top:calc(var(--top) + 10px);height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;z-index:2}
.story .pb i{display:block;height:100%;background:#fff;animation:prog 6s linear forwards}
.story .go{position:absolute;left:16px;right:16px;bottom:calc(20px + var(--bot))}
@keyframes prog{from{width:0}to{width:100%}}
.empty{padding:50px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{color:var(--text);font-size:17px;font-weight:600}
.track .st{display:flex;gap:12px;position:relative;padding-bottom:20px}
.track .st:last-child{padding-bottom:0}
.track .d{width:28px;height:28px;border-radius:50%;background:#E8E3E3;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
.track .st.done .d{background:var(--ok)}
.track .st.cur .d{background:var(--red);animation:pulse 1.4s infinite}
.track .st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#E8E3E3}
.track .st.done::before{background:var(--ok)}
.track .st:last-child::before{display:none}
.track b{display:block;font-weight:600}
.track small{color:var(--muted);font-size:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}70%{box-shadow:0 0 0 10px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.powered{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 14px}
.powered b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function unit(p,sel){let t=p.price;p.g.forEach(g=>(sel[g.id]||[]).forEach(i=>t+=g.opts[i][1]));return t}
function totals(){
  const sub=S.cart.reduce((a,l)=>a+l.unit*l.qty,0)+S.poset*POSET_PRICE;
  let disc=0;const c=T.coupon&&COUPONS[T.coupon];
  if(c)disc=Math.round(S.cart.reduce((a,l)=>a+l.unit*l.qty,0)*c.pct)/100;
  if(T.coupon==='free'){const d=S.cart.filter(l=>prod(l.pid).doner).map(l=>prod(l.pid).price);if(d.length)disc=Math.min(...d)}
  const stamps=S.cart.filter(l=>prod(l.pid).doner).reduce((a,l)=>a+l.qty,0);
  return {sub,disc,total:Math.max(0,sub-disc),count:S.cart.reduce((a,l)=>a+l.qty,0),stamps};
}
const qtyOf=pid=>S.cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.qty,0);
function addLine(p,sel,qty){
  const opts=[];p.g.forEach(g=>(sel[g.id]||[]).forEach(i=>opts.push([g.name,g.opts[i][0]])));
  const key=p.id+'|'+JSON.stringify(opts);const ex=S.cart.find(l=>l.key===key);
  if(ex)ex.qty+=qty;else S.cart.push({key,pid:p.id,opts,sel:JSON.parse(JSON.stringify(sel)),unit:unit(p,sel),qty});save();
}

const boxHTML=()=>`<video class="vbx" src="img/v/doner-box.mp4" poster="img/v/doner-box.jpg" autoplay muted loop playsinline preload="auto" aria-label="Tavuk Döner Box hazırlanışı"></video>`;
const BOXES=new Set();
function startBoxes(){document.querySelectorAll('[data-dbx]').forEach(el=>{if(el._on)return;el._on=1;BOXES.add(boxAnim(el))})}
function stopBoxes(){BOXES.forEach(b=>b.stop());BOXES.clear()}
function boxAnim(el){
 const cv=el.querySelector('canvas'),im=el.querySelector('img'),cx=cv.getContext('2d');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let W=0,H=0,dpr=1,raf=0,last=0,spawn=0,parts=[],vis=true,dead=false;
 const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};
 const kinds=['fry','fry','fry','doner','doner','leaf','parsley','sauce'];
 const rnd=(a,b)=>a+Math.random()*(b-a);
 function add(){const k=kinds[Math.floor(Math.random()*kinds.length)];const s=W/320;
  parts.push({k,x:W*rnd(.34,.66),y:-30*s,vy:rnd(40,90)*s,vx:rnd(-18,18)*s,r:rnd(0,6.28),vr:rnd(-4,4),s:s*rnd(.85,1.15),land:H*rnd(.30,.40),c:rnd(0,1)})}
 function draw(p){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(p.s,p.s);
  if(p.k==='fry'){cx.fillStyle=p.c>.5?'#F6C445':'#F2B632';cx.strokeStyle='#D9962A';cx.lineWidth=1.4;rr(-5,-24,10,48,3);cx.fill();cx.stroke();cx.fillStyle='rgba(255,255,255,.35)';rr(-3,-21,2.5,40,1.2);cx.fill()}
  else if(p.k==='doner'){cx.fillStyle='#C9783A';cx.beginPath();cx.moveTo(-20,-6);cx.quadraticCurveTo(-6,-16,18,-9);cx.quadraticCurveTo(24,0,16,9);cx.quadraticCurveTo(-4,15,-19,7);cx.quadraticCurveTo(-25,0,-20,-6);cx.fill();cx.strokeStyle='#7A3E17';cx.lineWidth=2.2;cx.lineCap='round';cx.beginPath();cx.moveTo(-12,-4);cx.lineTo(-4,4);cx.moveTo(0,-7);cx.lineTo(8,3);cx.moveTo(10,-5);cx.lineTo(15,2);cx.stroke();cx.fillStyle='rgba(255,220,170,.35)';cx.beginPath();cx.ellipse(-2,-6,10,2.5,0,0,6.28);cx.fill()}
  else if(p.k==='leaf'){cx.fillStyle='#8CC63F';cx.beginPath();for(let i=0;i<=12;i++){const a=i/12*6.283,r=15+3*Math.sin(i*2.2);cx.lineTo(Math.cos(a)*r*1.2,Math.sin(a)*r*.75)}cx.closePath();cx.fill();cx.strokeStyle='#6AA22B';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(-14,0);cx.lineTo(14,0);cx.stroke()}
  else if(p.k==='parsley'){cx.fillStyle='#2E8B2E';[[0,-7],[-7,2],[7,2],[0,7]].forEach(([x,y])=>{cx.beginPath();cx.arc(x,y,5.5,0,6.28);cx.fill()});cx.strokeStyle='#2E7A2E';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(0,8);cx.lineTo(0,20);cx.stroke()}
  else{cx.fillStyle='#FFFDF6';cx.strokeStyle='rgba(0,0,0,.06)';cx.beginPath();cx.moveTo(0,-11);cx.bezierCurveTo(7,-2,8,4,0,8);cx.bezierCurveTo(-8,4,-7,-2,0,-11);cx.fill();cx.stroke()}
  cx.restore()}
 function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
 function frame(t){if(dead)return;raf=requestAnimationFrame(frame);if(!vis)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;
  if(!W||cv.clientWidth!==W)size();
  spawn-=dt;if(spawn<=0){add();spawn=rnd(.18,.42)}
  cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>{p.vy+=420*(W/320)*dt;p.y+=p.vy*dt;p.x+=p.vx*dt;p.r+=p.vr*dt;
   if(p.y>p.land){im.classList.remove('bump');void im.offsetWidth;if(Math.random()<.35)im.classList.add('bump');return false}draw(p);return true})}
 const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting;last=0},{threshold:.05});io.observe(el);
 size();if(reduce){for(let i=0;i<6;i++){add();parts[i].y=parts[i].land*rnd(.2,.8)}parts.forEach(draw)}else raf=requestAnimationFrame(frame);
 return {stop(){dead=true;cancelAnimationFrame(raf);io.disconnect()}}}

function prevCard(o){return `<div class="prev"><div class="d num">Sipariş Tarihi : ${esc(o.date)}</div><div class="i">${o.lines.map(l=>esc(prod(l.pid).name)).join(', ')}</div><div style="display:flex;gap:8px;align-items:center"><span class="num" style="font-weight:600;flex:1">${tl(o.total)}</span><button class="btn btn-red sm" data-a="reorder" data-v="${o.no}">${I.refresh(16)} Tekrarla</button></div><button class="label" data-a="track" data-v="${o.no}" style="text-align:left;text-decoration:underline">Sipariş detayı</button></div>`}
V.cards=()=>`${hdr('Kayıtlı Kartlarım')}${S.cards.length?S.cards.map((c,i)=>`<div class="row">${I.card(22)}<span class="l">${esc(c.name)}<br><small class="muted num">${esc(c.mask)}</small></span><button data-a="rmcard" data-v="${i}" aria-label="Kartı sil" style="color:var(--red)">${I.trash(20)}</button></div>`).join(''):`<div class="empty">${I.card(52)}<h3>Kayıtlı kartın yok</h3><p>Ödeme sırasında “Kartımı kaydet” seçeneğiyle ekleyebilirsin.</p></div>`}`;
V.prefs=()=>`${hdr('İletişim Tercihleri')}${[['push','Anlık bildirim'],['sms','SMS'],['mail','E-posta']].map(([k,l])=>`<div class="row"><span class="l">${l}</span><button class="toggle ${S.prefs[k]?'on':''}" data-a="pref" data-v="${k}" aria-label="${l}"></button></div>`).join('')}<p class="label pad" style="line-height:1.5">Kampanya ve fırsat bildirimleri için kullanılır. Sipariş durum bildirimleri her zaman gönderilir.</p>`;
V.help=()=>{const b=branch();return `${hdr('Yardım Merkezi')}${[['Siparişimi nasıl iptal ederim?','Hazırlanmaya başlamamış siparişler için şubeyi arayabilirsin.'],['Damgalar ne zaman yüklenir?','Ödeme tamamlandığında tavuk döner ürünlerinin her biri için 1 damga hesabına eklenir.'],['Cüzdana yüklediğim para iade edilir mi?','Cüzdan bakiyesi tüm şubelerde siparişlerde kullanılabilir. İade talepleri için şubeyle iletişime geç.']].map(([q,a])=>`<details class="card"><summary style="font-weight:500;cursor:pointer">${q}</summary><p class="label" style="margin-top:8px;line-height:1.6">${a}</p></details>`).join('')}
 <div class="card"><b style="font-weight:600">${esc(b.name)}</b>${b.tel?`<p class="num" style="margin-top:6px;user-select:all">${esc(b.tel)}</p><button class="btn btn-out sm" style="margin-top:10px" data-a="copy" data-v="${esc(b.tel)}">${I.copy(16)} Numarayı Kopyala</button>`:'<p class="label" style="margin-top:6px">Telefon bilgisi eklenecek.</p>'}</div>`};

V.doc=()=>{const id=T.params.id;const name=DOCNAMES[id];const upd='Son güncelleme: 19.10.2026';
 const seller=`<table><tr><td>Unvan</td><td>${co('unvan','Şirket unvanı')}</td></tr><tr><td>Marka</td><td>Mixsos</td></tr><tr><td>Adres</td><td>${co('adres','Merkez adresi')}</td></tr><tr><td>Vergi dairesi / No</td><td>${co('vergiDairesi','Vergi dairesi')} / ${co('vergiNo','Vergi no')}</td></tr><tr><td>MERSİS No</td><td>${co('mersis','MERSİS no')}</td></tr><tr><td>Ticaret Sicil No</td><td>${co('sicil','Ticaret sicil no')}</td></tr><tr><td>Telefon</td><td class="num">${co('tel','Telefon')}</td></tr><tr><td>E-posta</td><td>${co('eposta','E-posta')}</td></tr><tr><td>KEP adresi</td><td>${co('kep','KEP adresi')}</td></tr></table>`;
 const t=totals();const b=branch();
 const order=S.cart.length?`<table>${S.cart.map(l=>`<tr><td>${l.qty} × ${esc(prod(l.pid).name)}${l.opts.length?'<br><small>'+l.opts.map(o=>esc(o[1])).join(', ')+'</small>':''}</td><td class="num">${tl(l.unit*l.qty)}</td></tr>`).join('')}${S.poset?`<tr><td>${S.poset} × Poşet</td><td class="num">${tl(S.poset*POSET_PRICE)}</td></tr>`:''}${t.disc?`<tr><td>İndirim</td><td class="num">−${tl(t.disc)}</td></tr>`:''}<tr><td><b>Toplam (KDV dahil)</b></td><td class="num"><b>${tl(t.total)}</b></td></tr></table>`:'<p>Sözleşme konusu ürünler, sipariş sırasında sepet ve ödeme ekranında gösterilen ürünlerdir.</p>';
 const buyer=S.user?`<table><tr><td>Ad Soyad</td><td>${esc(S.user.name)}</td></tr><tr><td>Telefon</td><td class="num">+90 ${esc(S.user.phone)}</td></tr><tr><td>Teslimat</td><td>${S.mode==='adres'&&S.address?esc([S.address.mah,S.address.sok,S.address.ilce,S.address.il].filter(Boolean).join(', ')):esc(b.name)+' (şubeden teslim)'}</td></tr></table>`:'<p>Uygulamaya kayıtlı ad, soyad, telefon ve teslimat bilgileri.</p>';
 let h='';
 if(id==='about')h=`<h2>Hakkımızda</h2>
  <p>Kral Dönerci adıyla 10 yılda 23 şubeye ulaştık. Ardından bambaşka bir konsept ve anlayışla Mixsos’u kurduk; bugün toplam 40 şubemiz var. Tavuk döner, dürüm, burger, box menüler ve atıştırmalıklarla hizmet veriyoruz. Sloganımız: “Lezzette ısrarcıyız.”</p><p>Ürünlerimiz, Sakarya’daki 5.000 m² üretim tesisimizde veteriner hekim ve gıda mühendislerinin denetiminde üretilir ve soğuk zincirle şubelerimize ulaştırılır.</p>
  <p>Mixsos uygulamasıyla menüyü inceleyebilir, siparişini şubeden teslim almak ya da şubede yemek üzere verebilir, kartla veya Mixsos Cüzdan ile güvenle ödeyebilirsin. Her tavuk döner siparişinde damga kazanır, 10 damgada bir tavuk döneri hediye alırsın.</p>
  <h3>Şubelerimiz</h3><ul>${BR.map(x=>`<li><b>${esc(x.name)}</b>: ${esc(x.addr)}${x.tel?' · <span class="num">'+esc(x.tel)+'</span>':''} · Çalışma saatleri <span class="num">${x.hours}</span></li>`).join('')}</ul>
  <h3>Şirket Bilgileri</h3>${seller}
  <h3>Güvenli Alışveriş</h3><p>Uygulama ve web sitemiz 256-bit SSL sertifikasıyla şifrelenmiş bağlantı üzerinden çalışır. Kartlı ödemeler, lisanslı ödeme kuruluşu iyzico altyapısıyla 3D Secure doğrulamasıyla alınır. Kart bilgilerin Mixsos tarafından görülmez ve saklanmaz.</p>`;
 if(id==='teslimat')h=`<h2>Teslimat ve İade Şartları</h2><p class="meta">${upd}</p>
  <h3>1. Teslimat Yöntemleri</h3><ul><li><b>Şubeden Al (Gel-Al):</b> Sipariş seçtiğin şubede hazırlanır, hazır olduğunda kasadan teslim alırsın.</li><li><b>Şubede Servis:</b> Ödeme ekranında “Siparişimi şubede yemek istiyorum” seçeneğini işaretlersen siparişin masana servis edilir.</li><li><b>Adrese Teslim:</b> Hizmet verilen bölgelerde kullanılabilir. Teslimat ücreti varsa ödeme öncesinde sepet ekranında ayrıca gösterilir.</li></ul>
  <h3>2. Hazırlama ve Teslim Süresi</h3><p>Siparişin ödeme onayının ardından şubeye iletilir. Hazırlanma durumu sipariş takip ekranından anlık izlenebilir. Gel-al siparişleri, hazır bildirimi sonrasında şubenin çalışma saatleri içinde teslim alınmalıdır.</p>
  <h3>3. Cayma Hakkı</h3><p>Mesafeli Sözleşmeler Yönetmeliği’nin 15. maddesinin (1) fıkrasının (c) bendi uyarınca, çabuk bozulabilen gıda ürünlerinin teslimine ilişkin sözleşmelerde cayma hakkı kullanılamaz. Bu nedenle hazırlanmaya başlanan siparişler için cayma hakkı bulunmamaktadır.</p>
  <h3>4. Sipariş İptali</h3><p>Siparişin hazırlanmaya başlamadan önce şubeyi arayarak iptal talebinde bulunabilirsin. İptal onaylanırsa ödemenin tamamı iade edilir. Hazırlanmaya başlanmış siparişler iptal edilemez.</p>
  <h3>5. Hatalı, Eksik veya Kusurlu Ürün</h3><p>Teslim aldığın üründe eksiklik, yanlışlık veya kusur olması hâlinde teslim anında ya da en geç 24 saat içinde şubeye veya müşteri hizmetlerine bildirmen hâlinde ürün yeniden hazırlanır ya da bedeli iade edilir. Bu durumda 6502 sayılı Tüketicinin Korunması Hakkında Kanun’dan doğan seçimlik hakların saklıdır.</p>
  <h3>6. İade Süreci</h3><ul><li>Kartla yapılan ödemelerin iadesi, ödemenin yapıldığı karta iyzico aracılığıyla yapılır. Tutarın kart hesabına yansıma süresi bankana göre değişir.</li><li>Mixsos Cüzdan ile yapılan ödemelerin iadesi cüzdan bakiyesine yapılır.</li><li>Kampanya ve damga hediyesiyle alınan ürünler için nakit iade yapılmaz.</li></ul>
  <h3>7. İletişim</h3><p>Telefon: <span class="num">${co('tel','Telefon')}</span> · E-posta: ${co('eposta','E-posta')}</p>`;
 if(id==='gizlilik')h=`<h2>Gizlilik Sözleşmesi ve Kişisel Verilerin Korunması Aydınlatma Metni</h2><p class="meta">${upd}</p>
  <p>Bu metin, 6698 sayılı Kişisel Verilerin Korunması Kanunu (“KVKK”) kapsamında veri sorumlusu sıfatıyla ${co('unvan','Şirket unvanı')} (“Mixsos”) tarafından, Mixsos mobil uygulaması ve web sitesini kullananların kişisel verilerinin nasıl işlendiğini açıklamak amacıyla hazırlanmıştır.</p>
  <h3>1. İşlenen Kişisel Veriler</h3><ul><li><b>Kimlik ve iletişim:</b> Ad, soyad, cep telefonu numarası, e-posta (verirsen).</li><li><b>Müşteri işlem:</b> Sipariş içeriği, seçilen şube, sipariş notu, sipariş geçmişi, damga ve cüzdan hareketleri, favoriler.</li><li><b>Teslimat:</b> Adrese teslim seçilirse teslimat adresi.</li><li><b>İşlem güvenliği:</b> IP adresi, cihaz ve uygulama bilgileri, oturum kayıtları.</li><li><b>Pazarlama:</b> İletişim tercihlerin (yalnızca onay vermen hâlinde).</li></ul>
  <h3>2. Kart Bilgileri</h3><p>Kart numarası, son kullanma tarihi ve güvenlik kodu Mixsos sunucularına iletilmez ve Mixsos tarafından saklanmaz. Kartlı ödemeler, BDDK lisanslı ödeme kuruluşu iyzico tarafından PCI-DSS standartlarına uygun olarak işlenir. “Kartımı kaydet” seçeneğinde kart bilgisi iyzico tarafından saklanır; uygulamada yalnızca maskelenmiş kart numarası gösterilir.</p>
  <h3>3. İşleme Amaçları</h3><ul><li>Siparişin alınması, hazırlanması, teslimi ve ödemenin tahsili,</li><li>Üyelik, damga kartı ve cüzdan hizmetlerinin sunulması,</li><li>Talep ve şikâyetlerin yanıtlanması,</li><li>Yasal yükümlülüklerin (fatura, vergi, tüketici mevzuatı) yerine getirilmesi,</li><li>Bilgi güvenliğinin sağlanması ve kötüye kullanımın önlenmesi,</li><li>Onay vermen hâlinde kampanya ve fırsat bildirimlerinin gönderilmesi.</li></ul>
  <h3>4. Hukuki Sebepler</h3><p>Kişisel veriler; KVKK m.5/2-(c) sözleşmenin kurulması ve ifası, (ç) hukuki yükümlülüğün yerine getirilmesi, (f) meşru menfaat hukuki sebeplerine; pazarlama iletişimi için ise m.5/1 uyarınca açık rızana dayanılarak işlenir.</p>
  <h3>5. Aktarım</h3><p>Kişisel veriler, yukarıdaki amaçlarla sınırlı olarak; ödeme hizmeti için iyzico’ya, SMS doğrulama ve bildirim hizmet sağlayıcılarına, barındırma ve altyapı hizmeti aldığımız iş ortaklarına ve yasal olarak yetkili kamu kurumlarına aktarılabilir. Yurt dışında bulunan altyapı sağlayıcılarına aktarım KVKK m.9 hükümlerine uygun olarak yapılır.</p>
  <h3>6. Saklama Süresi</h3><p>Veriler, işleme amacının gerektirdiği süre ve ilgili mevzuatta öngörülen zamanaşımı süreleri boyunca saklanır; süre sonunda silinir, yok edilir veya anonim hâle getirilir. Hesabını silmen hâlinde yasal saklama yükümlülüğü bulunmayan veriler silinir.</p>
  <h3>7. Çerezler ve Yerel Depolama</h3><p>Uygulama; sepetin, oturumun ve tercihlerin cihazında hatırlanması için yerel depolama kullanır. Bu veriler reklam amacıyla üçüncü kişilerle paylaşılmaz.</p>
  <h3>8. Güvenlik</h3><p>Uygulama ile sunucular arasındaki tüm iletişim 256-bit SSL/TLS şifrelemesiyle korunur. Verilere erişim yetkili personelle sınırlıdır.</p>
  <h3>9. Haklarınız</h3><p>KVKK m.11 uyarınca verilerinin işlenip işlenmediğini öğrenme, bilgi talep etme, düzeltilmesini veya silinmesini isteme, aktarıldığı kişileri bilme, itiraz etme ve zararın giderilmesini talep etme haklarına sahipsin. Başvurularını ${co('eposta','E-posta')} adresine veya ${co('adres','Merkez adresi')} adresine yazılı olarak iletebilirsin. Başvurular en geç 30 gün içinde ücretsiz olarak sonuçlandırılır.</p>`;
 if(id==='mesafeli')h=`<h2>Mesafeli Satış Sözleşmesi</h2><p class="meta">${upd}</p>
  <h3>Madde 1 – Taraflar</h3><p><b>1.1 Satıcı</b></p>${seller}<p style="margin-top:10px"><b>1.2 Alıcı</b></p>${buyer}
  <h3>Madde 2 – Konu</h3><p>İşbu sözleşmenin konusu, Alıcı’nın Mixsos mobil uygulaması veya web sitesi üzerinden elektronik ortamda sipariş verdiği aşağıda nitelikleri ve satış fiyatı belirtilen ürünlerin satışı ve teslimine ilişkin olarak 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve Mesafeli Sözleşmeler Yönetmeliği hükümleri gereğince tarafların hak ve yükümlülüklerinin belirlenmesidir.</p>
  <h3>Madde 3 – Sözleşme Konusu Ürünler</h3>${order}<p>Fiyatlara KDV dahildir.</p>
  <h3>Madde 4 – Ödeme</h3><p>Ödeme; kredi/banka kartıyla iyzico güvenli ödeme altyapısı ve 3D Secure doğrulamasıyla ya da Mixsos Cüzdan bakiyesiyle peşin olarak yapılır. Ödeme onaylanmadan sipariş hazırlanmaz.</p>
  <h3>Madde 5 – Teslimat</h3><p>Ürünler, Alıcı’nın sipariş sırasında seçtiği yöntemle (şubeden teslim, şubede servis veya hizmet bölgesindeyse adrese teslim) teslim edilir. Teslimat şartları <b>Teslimat ve İade Şartları</b> sayfasında yer alır ve işbu sözleşmenin ekidir.</p>
  <h3>Madde 6 – Cayma Hakkı</h3><p>Sözleşme konusu ürünler çabuk bozulabilen gıda ürünleri olduğundan, Mesafeli Sözleşmeler Yönetmeliği m.15/1-(c) uyarınca Alıcı’nın cayma hakkı bulunmamaktadır. Alıcı, siparişi onaylamadan önce bu hususta bilgilendirildiğini kabul eder.</p>
  <h3>Madde 7 – Satıcının Yükümlülükleri</h3><p>Satıcı, ürünleri siparişe uygun, sağlam ve gıda mevzuatına uygun biçimde hazırlayıp teslim etmekle yükümlüdür. Ayıplı veya eksik ürünlerde Alıcı’nın 6502 sayılı Kanun’dan doğan seçimlik hakları saklıdır.</p>
  <h3>Madde 8 – Uyuşmazlıkların Çözümü</h3><p>Uyuşmazlıklarda, Ticaret Bakanlığınca her yıl ilan edilen parasal sınırlar dâhilinde Alıcı’nın veya Satıcı’nın yerleşim yerindeki Tüketici Hakem Heyetleri, bu sınırları aşan durumlarda Tüketici Mahkemeleri yetkilidir.</p>
  <h3>Madde 9 – Yürürlük</h3><p>Alıcı, ödeme ekranında bu sözleşmeyi ve Ön Bilgilendirme Formu’nu okuyup onayladığında sözleşme kurulmuş sayılır. Sözleşmenin bir örneği Alıcı’nın sipariş geçmişinde saklanır.</p>`;
 if(id==='onbilgi')h=`<h2>Ön Bilgilendirme Formu</h2><p class="meta">${upd}</p>
  <h3>1. Satıcı Bilgileri</h3>${seller}
  <h3>2. Alıcı Bilgileri</h3>${buyer}
  <h3>3. Ürünler ve Toplam Bedel</h3>${order}<p>Tüm fiyatlara vergiler dahildir. Gel-al ve şubede servis siparişlerinde ayrıca teslimat ücreti alınmaz.</p>
  <h3>4. Ödeme ve Teslimat</h3><p>Ödeme, sipariş anında iyzico güvenli ödeme altyapısıyla kartla veya Mixsos Cüzdan ile yapılır. Sipariş, ödeme onayından sonra seçilen şubede hazırlanır ve seçilen yöntemle teslim edilir.</p>
  <h3>5. Cayma Hakkı</h3><p>Çabuk bozulabilen gıda ürünleri olması nedeniyle Mesafeli Sözleşmeler Yönetmeliği m.15/1-(c) uyarınca cayma hakkı bulunmamaktadır.</p>
  <h3>6. Şikâyet ve Başvuru</h3><p>Şikâyetlerini <span class="num">${co('tel','Telefon')}</span> numaralı telefona veya ${co('eposta','E-posta')} adresine iletebilirsin. Parasal sınırlar dâhilinde Tüketici Hakem Heyetlerine, aşan durumlarda Tüketici Mahkemelerine başvurabilirsin.</p>`;
 return `${hdr(name)}<article class="doc">${h}</article>${trust()}`};

function sheetHTML(){const s=T.sheet;if(!s)return '';
 const wrap=(h)=>`<div class="scrim" data-a="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div>${h}</div></div>`;
 if(s==='upsell')return wrap(`<h3>Sana Eşlik Etsin!</h3>${UPSELL.map(prod).map(p=>`<div class="sl"><img src="img/p/${p.img}.jpg" alt=""><div class="t">${esc(p.name)}<span class="num">${tl(p.price)}</span></div><button class="plus" data-a="upadd" data-v="${p.id}" aria-label="Ekle">${I.plus(16)}</button></div>`).join('')}<div class="pad" style="margin-top:12px"><button class="btn btn-red" data-a="gocheckout">Ödemeye Geç</button></div>`);
 if(s==='prev')return wrap(`<h3>Önceki Siparişlerim</h3><div class="hscroll">${S.orders.slice(0,5).map(prevCard).join('')}</div>`);

  <button class="row ${T.payWith==='card'?'on':''}" data-a="pw" data-v="card">${I.card(22)}<span class="l">${LIVE_PAY?'Kredi / Banka Kartı (iyzico)':'Yeni Kart ile Öde'}</span><span class="radio"></span></button>

 if(s==='topup')return wrap(`<h3>Para Yükle</h3><div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[100,250,500,750,1000,2000].map(v=>`<button class="btn ${T.topup===v?'btn-ink':'btn-out'}" style="height:48px;border-radius:12px" data-a="tv" data-v="${v}">${v} TL</button>`).join('')}</div><p class="label pad" style="margin:10px 0">500 TL ve üzeri yüklemelerde %5 bonus.</p><div class="pad"><button class="btn btn-red" data-a="dotopup">Devam · ${tl(T.topup||250)}</button></div>`);
 if(s==='name')return wrap(`<h3>Adın Soyadın</h3><form id="nameForm" class="pad" style="display:flex;flex-direction:column;gap:12px"><input class="input" id="nname" maxlength="40" value="${esc(S.user.name)}"><button class="btn btn-red" type="submit">Kaydet</button></form>`);
 if(s==='invite'){const code='MX'+(S.user?S.user.phone.slice(-4):'0000');return wrap(`<h3>Arkadaşına Öner</h3><p class="label pad" style="text-align:center;line-height:1.5">Davet kodunu paylaş, arkadaşın uygulamayı indirsin.</p><div class="pad" style="margin-top:12px;display:flex;gap:8px"><span class="input num" style="display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:3px;user-select:all">${code}</span><button class="btn btn-red" style="width:auto;padding:0 18px" data-a="copy" data-v="${code}">${I.copy(18)}</button></div>`)}
 if(s==='clear')return wrap(`<h3>Sepet boşaltılsın mı?</h3><div class="pad" style="display:flex;gap:10px"><button class="btn btn-out" data-a="closesheet2">Vazgeç</button><button class="btn btn-red" data-a="doclear">Boşalt</button></div>`);
 if(s==='notif')return wrap(`<h3>Bildirimler</h3><div class="empty" style="padding:20px">${I.bell(40)}<p>Yeni bildirimin yok. Sipariş durumu ve kampanyalar burada görünecek.</p></div>`);
 return ''}

// ---------- Render ----------
function render(){clearTimers();stopBoxes();
 $('#view').innerHTML=V[T.route]();
 const showNav=TABS.includes(T.route)||['favs','orders','cards','prefs','help','track','doc'].includes(T.route);
 const nav=$('#nav');nav.hidden=!showNav;if(showNav)nav.innerHTML=bottomNav();
 const L=$('#layer');L.querySelectorAll('.scrim').forEach(e=>e.remove());if(T.sheet)L.insertAdjacentHTML('beforeend',sheetHTML());
 after();startBoxes();}
function after(){const r=T.route;
 if(r==='home'){const sl=$('#slides'),cnt=$('#cnt');let i=0;
   sl.addEventListener('scroll',()=>{i=Math.round(sl.scrollLeft/sl.clientWidth);cnt.textContent=(i+1)+'/'+SLIDES.length},{passive:true});
   timers.push(setInterval(()=>{if(document.hidden)return;i=(i+1)%SLIDES.length;sl.scrollTo({left:i*sl.clientWidth,behavior:'smooth'})},4500));
   const v=$('#view');const spy=()=>{let cur=CATS[0][0];for(const [id] of CATS){const el=$('#sec-'+id);if(el&&el.getBoundingClientRect().top<200)cur=id}if(cur!==T.cat){T.cat=cur;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===cur));const a=$(`#chips [data-v="${cur}"]`);a&&a.scrollIntoView({inline:'center',block:'nearest'})}};
   v.onscroll=spy;
   if(T.showPrev&&S.user&&S.orders.length&&T.storyDone){T.showPrev=false;T.sheet='prev';$('#layer').insertAdjacentHTML('beforeend',sheetHTML())}
 } else $('#view').onscroll=null;
 if(r==='search'){const q=$('#q');q.addEventListener('input',e=>{T.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)})}
 if(r==='qr'&&S.user){if(!T.qr)T.qr=String(100000+Math.floor(Math.random()*900000));drawQR();
   timers.push(setInterval(()=>{T.qrLeft--;if(T.qrLeft<=0){T.qrLeft=60;T.qr=String(100000+Math.floor(Math.random()*900000));rerender();return}const l=$('#qleft');if(l)l.textContent=T.qrLeft;document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('off',k>=Math.ceil(T.qrLeft/3)))},1000))}
 if(r==='track'){const o=S.orders.find(x=>x.no===T.params.no)||S.orders[0];if(o&&o.status<2)timers.push(setTimeout(()=>{o.status++;save();if(T.route==='track')rerender()},5000))}
 if(r==='login'){$('#loginForm').addEventListener('submit',loginSubmit);const f=$('#phone')||$('#otp');f&&f.focus()}
 if(r==='cardform'){bindCard();$('#cardForm').addEventListener('submit',cardSubmit)}
 if(r==='threeds')$('#tdsForm').addEventListener('submit',e=>{e.preventDefault();if($('#tds').value!=='283126'){toast('Kod hatalı. Demo kodu: 283126',1);return}finishPay()});
 if(r==='camps')$('#promoForm').addEventListener('submit',e=>{e.preventDefault();const c=($('#promo').value||'').trim().toLocaleUpperCase('tr');if(CODES[c]){if(!S.codes.includes(c))S.codes.push(c);save();toast(COUPONS[CODES[c]].title+' hesabına tanımlandı.')}else toast('Bu kod geçerli değil.',1)});
 if(r==='checkout'){const n=$('#note');n&&n.addEventListener('input',e=>T.note=e.target.value)}
 if(r==='branches'){const il=$('#il');il&&il.addEventListener('change',e=>{T.il=e.target.value;rerender()});const af=$('#addrForm');af&&af.addEventListener('submit',e=>{e.preventDefault();S.address={il:$('#ail').value,ilce:$('#ailce').value.trim(),mah:$('#amah').value.trim(),sok:$('#asok').value.trim(),tar:$('#atar').value.trim()};S.mode='adres';save();toast('Adres kaydedildi.');back()})}
 const nf=$('#nameForm');nf&&nf.addEventListener('submit',e=>{e.preventDefault();const v=$('#nname').value.trim();if(v){S.user.name=v;save()}T.sheet=null;rerender();toast('Bilgilerin güncellendi.')});
}
function drawQR(){const c=$('#qrc');if(!c)return;const x=c.getContext('2d');const N=29;x.fillStyle='#fff';x.fillRect(0,0,N,N);x.fillStyle='#111';let s=+T.qr*7919;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(r()>.52)x.fillRect(i,j,1,1);
 [[0,0],[N-7,0],[0,N-7]].forEach(([a,b])=>{x.fillStyle='#fff';x.fillRect(Math.max(0,a-1),Math.max(0,b-1),9,9);x.fillStyle='#111';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#111';x.fillRect(a+2,b+2,3,3)})}

// ---------- iyzico ödeme ----------
function lineSel(l){if(l.sel)return l.sel;const p=prod(l.pid);const sel={};(l.opts||[]).forEach(([gn,on])=>{const g=p.g.find(x=>x.name===gn);if(!g)return;const i=g.opts.findIndex(o=>o[0]===on);if(i>=0)(sel[g.id]=sel[g.id]||[]).push(i)});return sel}
function busy(msg){const L=$('#layer');L.insertAdjacentHTML('beforeend',`<div class="scrim" id="busy" style="align-items:center;justify-content:center"><div class="card" style="text-align:center;max-width:300px;display:flex;flex-direction:column;gap:12px;align-items:center"><img src="img/pay/iyzico_ile_ode_colored_horizontal.svg" alt="iyzico ile Öde" style="height:28px"><p style="font-weight:500">${esc(msg)}</p><span class="ssl">${I.lock(14)} 256-bit SSL</span></div></div>`)}
function unbusy(){const b=$('#busy');b&&b.remove()}
async function startIyzico(kind,amount){
 const ret=location.origin+location.pathname;
 const b=branch();
 const body=kind==='topup'?{kind,amount,ret,buyer:S.user}
  :{kind:'order',ret,buyer:S.user,coupon:T.coupon,poset:S.poset,items:S.cart.map(l=>({pid:l.pid,qty:l.qty,sel:lineSel(l)})),
    address:S.mode==='adres'&&S.address?[S.address.mah,S.address.sok,S.address.ilce,S.address.il].filter(Boolean).join(', '):b.name+', '+b.addr};
 try{localStorage.setItem('mixsos.pending',JSON.stringify({kind,amount,coupon:T.coupon,note:T.note,dine:T.dineIn,at:Date.now()}))}catch(e){}
 busy('iyzico güvenli ödeme sayfası açılıyor…');
 try{
  const r=await fetch(PAY_API+'/pay/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||!d.paymentPageUrl)throw new Error(d.error||'Ödeme başlatılamadı');
  if(kind!=='topup'&&Math.abs(d.total-totals().total)>0.01){unbusy();toast('Sepet tutarı güncellendi: '+tl(d.total),1)}
  location.href=d.paymentPageUrl;
 }catch(e){unbusy();toast(e.message||'Bağlantı hatası. Tekrar dene.',1)}
}
function handlePayReturn(){
 const q=new URLSearchParams(location.search);const st=q.get('pay');if(!st)return false;
 let pend=null;try{pend=JSON.parse(localStorage.getItem('mixsos.pending')||'null');localStorage.removeItem('mixsos.pending')}catch(e){}
 try{history.replaceState(null,'',location.pathname)}catch(e){}
 T.storyDone=true;
 if(st==='success'){
  if(q.get('kind')==='topup'){const a=Number(q.get('amount'))||(pend&&pend.amount)||0;S.wallet.bal+=a;if(a>=500)S.wallet.bonus+=Math.round(a*.05);save();go('qr');toast(tl(a)+' cüzdanına yüklendi.');return true}
  if(pend){T.coupon=pend.coupon;T.note=pend.note||'';T.dineIn=!!pend.dine}
  T.pay={kind:'iyzico',paymentId:q.get('pid')};placeOrder();toast('Ödeme alındı. Siparişin şubeye iletildi.');return true}
 go(S.cart.length?'checkout':'home');if(pend){T.coupon=pend.coupon;T.note=pend.note||'';T.dineIn=!!pend.dine}rerender();toast(q.get('msg')||'Ödeme tamamlanamadı.',1);return true}

// ---------- Formlar ----------
function loginSubmit(e){e.preventDefault();
 if(!T.otp){const v=$('#phone').value.replace(/\D/g,'').replace(/^0/,'');if(!/^5\d{9}$/.test(v)){toast('Numarayı 5 ile başlayan 10 hane olarak gir.',1);return}T.phone=v;T.otp=true;rerender();toast('Doğrulama kodu gönderildi.');return}
 if($('#otp').value!=='123456'){toast('Kod hatalı. Demo kodu: 123456',1);return}
 const name=$('#uname').value.trim()||'Mixsos Üyesi';S.user={name,phone:T.phone};T.otp=false;save();toast('Hoş geldin, '+name.split(' ')[0]+'!');
 const n=T.afterLogin;T.afterLogin=null;T.stack.pop();if(n)go(n,{},{replace:true});else go('account')}
function bindCard(){const m={cname:'name',cno:'no',cexp:'exp',ccvc:'cvc'};Object.keys(m).forEach(id=>{const el=$('#'+id);el.addEventListener('input',e=>{let v=e.target.value;
 if(id==='cno'){v=v.replace(/\D/g,'').slice(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim()}
 if(id==='cexp'){v=v.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}
 if(id==='ccvc'){v=v.replace(/\D/g,'').slice(0,4);e.target.value=v}T.card[m[id]]=v})})}
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function cardSubmit(e){e.preventDefault();const c=T.card;
 if(c.name.trim().length<3)return toast('Kart üzerindeki ismi gir.',1);
 if(c.no.length<15||!luhn(c.no))return toast('Kart numarası geçersiz.',1);
 if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(c.exp))return toast('Son kullanma tarihini AA/YY olarak gir.',1);
 if(c.cvc.length<3)return toast('CVC en az 3 haneli olmalı.',1);
 go('threeds')}
function finishPay(){
 if(T.pay.kind==='card'&&T.card.save&&T.card.no){const mask=T.card.no.slice(0,6)+'******'+T.card.no.slice(-2);if(!S.cards.some(x=>x.mask===mask))S.cards.unshift({name:T.card.name,mask})}
 if(T.pay.topup){const a=T.pay.amount;S.wallet.bal+=a;if(a>=500)S.wallet.bonus+=Math.round(a*.05);save();T.pay=null;T.stack=[];go('qr');toast(tl(a)+' cüzdanına yüklendi.');return}
 placeOrder()}
function placeOrder(){const t=totals();const d=new Date();
 if(T.coupon==='free')S.stamps=Math.max(0,S.stamps-10);
 const o={paymentId:T.pay&&T.pay.paymentId||null,no:String(100000+Math.floor(Math.random()*900000)),date:d.toLocaleDateString('tr-TR'),lines:S.cart.slice(),total:t.total,disc:t.disc,stamps:t.stamps,branch:S.mode==='adres'?'Adrese Teslim':branch().name,mode:S.mode,dine:T.dineIn,note:T.note,status:0};
 S.orders.unshift(o);S.stamps+=t.stamps;S.cart=[];S.poset=0;T.coupon=null;T.consent=false;T.note='';T.noteOpen=false;T.pay=null;T.shownUpsell=false;save();T.stack=[];go('track',{no:o.no})}

// ---------- Olaylar ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a],[data-tab]');if(!el)return;
 if(el.classList.contains('scrim')&&e.target!==el)return;
 if(el.dataset.tab){go(el.dataset.tab);return}
 const a=el.dataset.a,v=el.dataset.v;const p=v&&prod(v);
 switch(a){
  case 'back':uiBack();break;
  case 'notif':T.sheet='notif';rerender();break;
  case 'qr':go('qr');break;
  case 'branches':T.tmpBranch=S.branch;T.brView='list';T.il=branch().il;go('branches');break;
  case 'cat':{T.cat=v;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));const s=$('#sec-'+v);s&&s.scrollIntoView({behavior:'smooth',block:'start'});break}
  case 'fav':{const i=S.favs.indexOf(v);if(i>=0)S.favs.splice(i,1);else{S.favs.push(v);toast('Favorilerine eklendi.')}save();rerender();break}
  case 'openp':T.sel={};T.qty=1;T.tried=false;go('product',{id:v});break;
  case 'quick':if(p.g.some(g=>g.req)){T.sel={};T.qty=1;T.tried=false;go('product',{id:v})}else{addLine(p,{},1);rerender();toast('Sepete Başarıyla Eklendi')}break;
  case 'dec':removeOne(v);rerender();break;
  case 'pq':T.qty=Math.max(1,T.qty+(+v));rerender();break;
  case 'pick':{const pr=prod(T.params.id);const g=pr.g.find(x=>x.id===el.dataset.g);const i=+el.dataset.i;let s=T.sel[g.id]||[];
    if(g.max===1)s=[i];else if(s.includes(i))s=s.filter(x=>x!==i);else if(s.length<g.max)s=[...s,i];else{toast('En fazla '+g.max+' seçim yapabilirsin.',1);break}T.sel[g.id]=s;rerender();break}
  case 'addcart':{const pr=prod(T.params.id);const miss=pr.g.find(g=>g.req&&!(T.sel[g.id]||[]).length);
    if(miss){T.tried=true;rerender();const g=$('#g-'+miss.id);g&&g.scrollIntoView({behavior:'smooth',block:'center'});toast(miss.name+' zorunlu.',1);break}
    addLine(pr,T.sel,T.qty);playAdd(()=>{back();toast('Sepete Başarıyla Eklendi')});break}
  case 'cq':{const l=S.cart[+el.dataset.i];l.qty+=+v;if(l.qty<1)S.cart.splice(+el.dataset.i,1);save();rerender();break}
  case 'poset':S.poset=Math.max(0,S.poset+(+v));save();rerender();break;
  case 'upadd':addLine(p,{},1);rerender();toast(p.name+' eklendi.');break;
  case 'clear':T.sheet='clear';rerender();break;
  case 'doclear':S.cart=[];S.poset=0;save();T.sheet=null;rerender();toast('Sepet boşaltıldı.');break;
  case 'closesheet2':T.sheet=null;rerender();break;
  case 'tocheckout':if(needLogin('cart'))break;if(!T.shownUpsell){T.shownUpsell=true;T.sheet='upsell';rerender();break}go('checkout');break;
  case 'gocheckout':T.sheet=null;go('checkout');break;
  case 'dine':T.dineIn=!T.dineIn;rerender();break;
  case 'note':T.noteOpen=!T.noteOpen;rerender();break;
  case 'paysheet':T.sheet='pay';rerender();break;
  case 'pw':T.payWith=v;T.sheet=null;rerender();break;
  case 'coupon':T.coupon=T.coupon===v?null:v;rerender();if(T.coupon)toast('Kampanya uygulandı.');break;
  case 'consent':T.consent=!T.consent;rerender();break;
  case 'doc':e.stopPropagation();go('doc',{id:v});break;
  case 'pay':{if(!T.consent){toast('Devam etmek için sözleşmeleri onayla.',1);const c=document.querySelector('.consent');c&&c.scrollIntoView({behavior:'smooth',block:'center'});break}const t=totals();
    if(T.payWith==='wallet'){if(S.wallet.bal+S.wallet.bonus<t.total){toast('Cüzdan bakiyen yetersiz. Önce para yükle.',1);break}let r=t.total;const fb=Math.min(S.wallet.bonus,r);S.wallet.bonus-=fb;r-=fb;S.wallet.bal-=r;T.pay={kind:'wallet'};placeOrder();break}
    if(LIVE_PAY){startIyzico('order');break}
    if(T.payWith==='saved'&&S.cards.length){T.pay={kind:'saved',amount:t.total};go('threeds');break}
    T.pay={kind:'card',amount:t.total};go('cardform');break}
  case 'testcard':T.card=Object.assign(T.card,{name:'Test Kullanıcı',no:'5528790000000008',exp:'12/30',cvc:'123'});rerender();break;
  case 'savecard':T.card.save=!T.card.save;rerender();break;
  case 'opencamp':go('camp',{id:v});break;
  case 'login':T.otp=false;T.phone=S.user?S.user.phone:'';go('login');break;
  case 'chphone':T.otp=false;rerender();break;
  case 'logout':S.user=null;save();go('account');toast('Çıkış yapıldı.');break;
  case 'editname':T.sheet='name';rerender();break;
  case 'invite':T.sheet='invite';rerender();break;
  case 'favs':case 'orders':case 'cards':case 'prefs':case 'help':go(a);break;
  case 'pref':S.prefs[v]=!S.prefs[v];save();rerender();break;
  case 'rmcard':S.cards.splice(+v,1);save();rerender();break;
  case 'reorder':{const o=S.orders.find(x=>x.no===v);o.lines.forEach(l=>{const ex=S.cart.find(c=>c.key===l.key);if(ex)ex.qty+=l.qty;else S.cart.push(Object.assign({},l))});save();T.sheet=null;go('cart');toast('Sipariş sepete eklendi.');break}
  case 'track':T.sheet=null;go('track',{no:v});break;
  case 'newqr':T.qr=String(100000+Math.floor(Math.random()*900000));T.qrLeft=60;rerender();break;
  case 'topup':if(needLogin('qr'))break;T.topup=T.topup||250;T.sheet='topup';rerender();break;
  case 'tv':T.topup=+v;rerender();break;
  case 'dotopup':if(LIVE_PAY){T.sheet=null;rerender();startIyzico('topup',T.topup);break}T.sheet=null;T.pay={kind:'card',topup:true,amount:T.topup};go('cardform');break;
  case 'mode':S.mode=v;save();rerender();break;
  case 'brview':T.brView=v;rerender();break;
  case 'brpick':T.tmpBranch=v;rerender();break;
  case 'brok':{const b=BR.find(x=>x.id===(T.tmpBranch||S.branch));S.branch=b.id;S.mode='gelal';save();back();toast(b.name+' seçildi.');break}
  case 'qset':T.q=v;rerender();break;
  case 'copy':(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Kopyalandı.')).catch(()=>toast('Metni seçip kopyalayabilirsin.',1));break;
  case 'closesheet':if(e.target===el){T.sheet=null;rerender()}break;
  case 'story':closeStory();go('camp',{id:'kebabi'});break;
  case 'storyx':closeStory();break;
 }
});
function closeStory(){const s=$('.story');s&&s.remove();T.storyDone=true;if(T.route==='home')rerender()}

// ---------- Açılış ----------
function hashDoc(){const h=(location.hash||'').slice(1);return DOCS[h]||null}
window.addEventListener('hashchange',()=>{const d=hashDoc();if(d)go('doc',{id:d})});
render();
(function boot(){if(handlePayReturn())return;const deep=hashDoc();if(deep){T.storyDone=true;go('doc',{id:deep});return}const L=$('#layer');
 L.insertAdjacentHTML('beforeend',`<div class="splash"><img class="bg" src="img/b/splash.jpg" alt=""><img class="lg" src="img/logo-white.png" alt="Mixsos"><span class="pw">Powered by <b>Lokus Studio</b></span></div>`);
 setTimeout(()=>{const s=$('.splash');s&&s.remove();
   L.insertAdjacentHTML('beforeend',`<div class="story"><div class="pb"><i></i></div><button class="x" data-a="storyx" aria-label="Kapat">${I.close(28)}</button><button data-a="story" style="flex:1;display:block" aria-label="Kampanyaya git"><img src="img/k5.jpg" alt="Kebabi, yeni ürün"></button><div class="go"><button class="btn btn-red" data-a="story">Hemen Dene</button></div></div>`);
   setTimeout(()=>{if($('.story'))closeStory()},6000)},1800)})();
</script>
