name: iOS — App Store'a yükle

# Elle çalıştırılır (Actions → "iOS — App Store'a yükle" → Run workflow)
# ya da commit mesajında [ios] geçtiğinde çalışır.
on:
  workflow_dispatch:
    inputs:
      metadata:
        description: "Ekran görüntüleri ve mağaza metinleri de güncellensin mi?"
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-14
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli bilgiler tanımlı mı
        run: |
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::$v secret'ı tanımlı değil"; exit 1; fi
          done

      - name: Sürüm numarasını belirle (App Store'daki sürümden bir üst)
        id: ver
        run: |
          CUR=$(curl -fsS "https://itunes.apple.com/lookup?bundleId=$BUNDLE_ID&country=tr" | python3 -c "import sys,json;r=json.load(sys.stdin)['results'];print(r[0]['version'] if r else '')" || true)
          if [ -z "$CUR" ]; then NEW="2.0.0"; else
            NEW=$(python3 -c "v='$CUR'.split('.')+['0','0'];print(f'{int(v[0])+1}.0.0')")
          fi
          echo "App Store'daki sürüm: ${CUR:-yok} → yeni sürüm: $NEW (build ${{ github.run_number }})"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: iOS projesini oluştur
        run: |
          python3 -c "import json;c=json.load(open('capacitor.config.json'));c['appId']='$BUNDLE_ID';json.dump(c,open('capacitor.config.json','w'),indent=2)"
          rm -rf shell/app && cp -r www shell/app
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Mixsos ikonu ve açılış görseli
        run: |
          python3 -m pip install --quiet pillow --break-system-packages || python3 -m pip install --quiet pillow
          python3 ci/brand_ios.py ios/App/App/Assets.xcassets www/img/logo-white.png

      - name: Info.plist ayarları
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Mixsos" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Mixsos" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$P" || true

      - name: App Store Connect anahtarı
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "api_key.json"), "w"))
          PY

      - name: Derle ve arşivle
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Mixsos.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60

      - name: App Store Connect'e yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Mixsos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Yüklendi: sürüm ${{ steps.ver.outputs.version }} (build ${{ github.run_number }}). App Store Connect'te işlenmesi 10–30 dk sürer."

      - name: Ekran görüntüleri ve mağaza metinleri
        if: github.event_name == 'push' || inputs.metadata
        run: |
          mkdir -p "$RUNNER_TEMP/shots/tr"
          cp store/screenshots/tr/*.png "$RUNNER_TEMP/shots/tr/"
          fastlane deliver --api_key_path "$RUNNER_TEMP/keys/api_key.json" \
            --app_identifier "$BUNDLE_ID" --app_version "${{ steps.ver.outputs.version }}" --platform ios \
            --metadata_path store/metadata --screenshots_path "$RUNNER_TEMP/shots" \
            --skip_binary_upload true --overwrite_screenshots true --skip_app_version_update false \
            --submit_for_review false --automatic_release false --run_precheck_before_submit false \
            --force true

      - name: Anahtarları temizle
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
