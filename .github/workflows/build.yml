name: Yayınla ve APK üret

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk:
        description: "APK de üretilsin mi?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) iyzico ödeme sunucusu (Firebase Cloud Functions). FIREBASE_SERVICE_ACCOUNT ve iyzico
  #    secret'ları tanımlı değilse atlanır; uygulama demo (sahte) ödemeyle çalışmaya devam eder.
  pay:
    runs-on: ubuntu-latest
    env:
      HAS_PAY: ${{ secrets.IYZICO_API_KEY != '' && secrets.IYZICO_SECRET_KEY != '' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      mode: ${{ steps.deploy.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Anahtarsız giriş (Workload Identity Federation): kuruluş politikası JSON anahtarı yasaklıyor.
      - name: Google Cloud'a giriş
        id: gauth
        if: ${{ env.HAS_PAY == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/507231348158/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@mixsos--web-site.iam.gserviceaccount.com
      - name: Firebase'e yükle
        id: deploy
        env:
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$HAS_PAY" != "true" ]; then
            echo "iyzico secret'ları eksik, demo ödeme modunda kalınıyor."; exit 0
          fi
          PROJECT=mixsos--web-site
          gcloud services enable cloudbilling.googleapis.com firebaseextensions.googleapis.com --project "$PROJECT" --quiet || true
          node ci/menu.mjs
          (cd functions && npm install --omit=dev --no-audit --no-fund)
          FB="npx --yes firebase-tools@14"
          printf '%s' "$IYZICO_API_KEY" > "$RUNNER_TEMP/k1"; printf '%s' "$IYZICO_SECRET_KEY" > "$RUNNER_TEMP/k2"; printf '%s' "${TELEGRAM_BOT_TOKEN:-none}" > "$RUNNER_TEMP/k3"
          $FB functions:secrets:set TELEGRAM_BOT_TOKEN --data-file "$RUNNER_TEMP/k3" --project "$PROJECT" --non-interactive --force
          $FB functions:secrets:set IYZICO_API_KEY --data-file "$RUNNER_TEMP/k1" --project "$PROJECT" --non-interactive --force
          $FB functions:secrets:set IYZICO_SECRET_KEY --data-file "$RUNNER_TEMP/k2" --project "$PROJECT" --non-interactive --force
          rm -f "$RUNNER_TEMP/k1" "$RUNNER_TEMP/k2" "$RUNNER_TEMP/k3"
          $FB deploy --only functions --project "$PROJECT" --non-interactive --force || { sleep 60; $FB deploy --only functions --project "$PROJECT" --non-interactive --force; }
          URL="https://europe-west1-$PROJECT.cloudfunctions.net/api"
          MODE=$(grep -q sandbox functions/.env && echo sandbox || echo live)
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Ödeme sunucusu: $URL ($MODE)"
          sleep 10; curl -fsS "$URL/health" || true
          # Botun eklendiği Telegram gruplarını listele (sohbet kimliklerini functions/.env'e yazmak için)
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates" | python3 -c "import sys,json;seen=set()
          for u in json.load(sys.stdin).get('result',[]):
            for k in ('message','my_chat_member','channel_post'):
              c=(u.get(k) or {}).get('chat')
              if c and c['id'] not in seen: seen.add(c['id']); print('::notice::Telegram sohbeti: %s → %s' % (c.get('title') or c.get('first_name'), c['id']))" || true
          fi

  site:
    needs: pay
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ödeme sunucusu adresini uygulamaya yaz
        run: |
          sed -i "s#__PAY_API__#${{ needs.pay.outputs.url }}#; s#__PAY_MODE__#${{ needs.pay.outputs.mode }}#" www/index.html
          grep -o "const PAY_API='[^']*'" www/index.html
      - name: gh-pages dalına yayınla
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd www
          touch .nojekyll
          [ -f ../CNAME ] && cp ../CNAME .
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Yayın ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # 2) APK: yalnızca uygulama kabuğu değişince gerekir (ikon, ad, izinler, canlı adres).
  #    Commit mesajında [apk] geçerse ya da Actions'tan elle çalıştırılırsa üretilir.
  apk:
    if: contains(github.event.head_commit.message, '[apk]') || (github.event_name == 'workflow_dispatch' && inputs.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Uygulamanın yedek kopyasını kabuğa koy
        run: |
          rm -rf shell/app && cp -r www shell/app
      - name: Android projesini oluştur
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Mixsos ikonu ve açılış görseli
        run: |
          pip install --quiet pillow
          python3 ci/brand.py android/app/src/main/res www/img/logo-white.png
      - name: Sabit test imzası
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Mixsos.apk
      - name: "Sürümler sayfasına koy (indirme linki sabit kalır)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mixsos test sürümü
          body: "Telefona kurmak için Mixsos.apk dosyasını indir. Uygulama içeriği jsDelivr CDN üzerinden her açılışta güncellenir; bu dosyayı yalnızca kabuk değiştiğinde tekrar kurman gerekir."
          files: Mixsos.apk
          make_latest: true
