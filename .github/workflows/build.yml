name: Yayınla ve APK üret

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk:
        description: "APK de üretilsin mi?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) iyzico ödeme sunucusu (Cloudflare Worker). Gerekli secret'lar tanımlı değilse atlanır,
  #    uygulama demo (sahte) ödemeyle çalışmaya devam eder.
  pay:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      mode: ${{ steps.deploy.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sunucu menüsünü uygulamadan üret
        run: node ci/menu.mjs
      - name: Worker'ı yayınla
        id: deploy
        working-directory: pay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$IYZICO_API_KEY" ] || [ -z "$IYZICO_SECRET_KEY" ]; then
            echo "Ödeme secret'ları eksik, demo ödeme modunda kalınıyor."; exit 0
          fi
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
          printf '%s' "$IYZICO_API_KEY" | npx --yes wrangler@3 secret put IYZICO_API_KEY
          printf '%s' "$IYZICO_SECRET_KEY" | npx --yes wrangler@3 secret put IYZICO_SECRET_KEY
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' deploy.log | head -1)
          MODE=$(grep -q 'sandbox' wrangler.toml && echo sandbox || echo live)
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Ödeme sunucusu: $URL ($MODE)"
          curl -fsS "$URL/health" || true

  # 1) Uygulamanın içeriği: her push'ta GitHub Pages'e çıkar. Telefondaki uygulama bu adresi açtığı için
  #    değişiklikler APK yeniden kurulmadan, uygulama bir sonraki açılışta görünür.
  site:
    needs: pay
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ödeme sunucusu adresini uygulamaya yaz
        run: |
          sed -i "s#__PAY_API__#${{ needs.pay.outputs.url }}#; s#__PAY_MODE__#${{ needs.pay.outputs.mode }}#" www/index.html
          grep -o "const PAY_API='[^']*'" www/index.html
      - name: gh-pages dalına yayınla
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd www
          touch .nojekyll
          [ -f ../CNAME ] && cp ../CNAME .
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Yayın ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # 2) APK: yalnızca uygulama kabuğu değişince gerekir (ikon, ad, izinler, canlı adres).
  #    Commit mesajında [apk] geçerse ya da Actions'tan elle çalıştırılırsa üretilir.
  apk:
    if: contains(github.event.head_commit.message, '[apk]') || (github.event_name == 'workflow_dispatch' && inputs.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Uygulamanın yedek kopyasını kabuğa koy
        run: |
          rm -rf shell/app && cp -r www shell/app
      - name: Android projesini oluştur
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Mixsos ikonu ve açılış görseli
        run: |
          pip install --quiet pillow
          python3 ci/brand.py android/app/src/main/res www/img/logo-white.png
      - name: Sabit test imzası
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Mixsos.apk
      - name: "Sürümler sayfasına koy (indirme linki sabit kalır)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mixsos test sürümü
          body: "Telefona kurmak için Mixsos.apk dosyasını indir. Uygulama içeriği jsDelivr CDN üzerinden her açılışta güncellenir; bu dosyayı yalnızca kabuk değiştiğinde tekrar kurman gerekir."
          files: Mixsos.apk
          make_latest: true
